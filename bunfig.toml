[install]
linker = "isolated"
# Wait three days before installing a newly published version, so a
# compromised release can be caught and unpublished before it lands here.
minimumReleaseAge = "3d"
# Better Auth 1.7.16 security release (2026-11-03). Remove after 2026-11-07.
minimumReleaseAgeExcludes = [
  "better-auth",
  "better-call",
  "@better-auth/api-key",
  "@better-auth/core",
  "@better-auth/drizzle-adapter",
  "@better-auth/kysely-adapter",
  "@better-auth/memory-adapter",
  "@better-auth/mongo-adapter",
  "@better-auth/prisma-adapter",
  "@better-auth/telemetry",
  # @effect/tsgo 0.67.3 (2026-11-05) for the Effect diagnostics in apps/api;
  # pinned exactly there. Remove after 2026-11-08.
  "@effect/tsgo",
  "@effect/tsgo-darwin-arm64",
  "@effect/tsgo-darwin-x64",
  "@effect/tsgo-linux-arm",
  "@effect/tsgo-linux-arm64",
  "@effect/tsgo-linux-x64",
  "@effect/tsgo-win32-arm64",
  "@effect/tsgo-win32-x64",
]

[install.lockfile]
save = true
