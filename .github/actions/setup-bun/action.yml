name: Setup Bun workspace
description: Install the pinned Bun version, restore caches and install dependencies

inputs:
  turbo-cache-scope:
    description: Unique cache writer scope per job and matrix target; empty disables Turbo caching
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.2

    - name: Restore Bun packages
      uses: actions/cache@v5
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-

    - name: Restore Turbo cache
      if: inputs.turbo-cache-scope != ''
      uses: actions/cache@v5
      with:
        path: .turbo
        key: turbo-v2-${{ runner.os }}-${{ github.ref_name }}-${{ inputs.turbo-cache-scope }}-${{ github.sha }}
        restore-keys: |
          turbo-v2-${{ runner.os }}-${{ github.ref_name }}-${{ inputs.turbo-cache-scope }}-
          turbo-v2-${{ runner.os }}-${{ github.ref_name }}-
          turbo-v2-${{ runner.os }}-main-

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
