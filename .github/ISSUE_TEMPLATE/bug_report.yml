name: Bug Report
description: Report a bug or issue with Lootlog
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What went wrong?
      placeholder: The respawn timer for Mietek Żul shows the wrong time after a kill.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we make it happen again?
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What happened instead?
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of Lootlog is affected?
      options:
        - Web Dashboard
        - Game Client
        - Discord Bot
        - API
        - Authentication
        - Search
        - Database
        - Other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, game interface (new or old), how you installed the game client, and its version.
      placeholder: |
        - Browser: Chrome 131
        - Game interface: new
        - Installation: Tampermonkey userscript
        - Lootlog version: 1.3.0
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag screenshots or recordings here.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Browser console errors or other output.
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Anything else that helps, such as your world or Organization setup.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and found no duplicate.
          required: true
        - label: I use the latest Lootlog version, or I gave my version above.
          required: false
