name: Deploy affected targets to development

on:
  push:
    branches: [main]

concurrency:
  group: development-deployment
  cancel-in-progress: true

permissions:
  contents: read

env:
  INFRA_REPOSITORY: lootlog/infra
  INFRA_REPO_PATH: infra-repo

jobs:
  plan:
    name: Plan affected targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
      docker-targets: ${{ steps.plan.outputs.docker_targets }}
      cloudflare-targets: ${{ steps.plan.outputs.cloudflare_targets }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Select affected deployment targets
        id: plan
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then BASE_SHA="$(git rev-parse "$HEAD_SHA^")"; fi
          affected="$(bunx turbo@2.10.12 query affected --base "$BASE_SHA" --head "$HEAD_SHA" --packages)"
          packages="$(jq -c '[.data.affectedPackages.items[].name]' <<< "$affected")"
          plan="$(
            git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" |
              jq -Rsc --argjson affectedPackages "$packages" \
                '{mode: "dev", affectedPackages: $affectedPackages, changedFiles: (split("\u0000") | map(select(length > 0)))}' |
              bun scripts/deployment-targets.mjs
          )"
          {
            echo "targets=$(jq -c '.targets' <<< "$plan")"
            echo "docker_targets=$(jq -c '[.targets[] | select(.kind == "docker")]' <<< "$plan")"
            echo "cloudflare_targets=$(jq -c '[.targets[] | select(.kind != "docker")]' <<< "$plan")"
          } >> "$GITHUB_OUTPUT"
          jq . <<< "$plan" >> "$GITHUB_STEP_SUMMARY"

  cloudflare:
    name: Deploy ${{ matrix.id }} to development
    needs: plan
    if: needs.plan.outputs.cloudflare-targets != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.cloudflare-targets) }}
    env:
      VITE_ACTIVITY_API_URL: ${{ vars.VITE_ACTIVITY_API_URL }}
      VITE_ADDON_INSTALL_URL: ${{ vars.VITE_ADDON_INSTALL_URL }}
      VITE_ADDON_URL: ${{ vars.VITE_ADDON_URL }}
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      VITE_AUTH_SERVICE_URL: ${{ vars.VITE_AUTH_SERVICE_URL }}
      VITE_BATTLELOG_API_URL: ${{ vars.VITE_BATTLELOG_API_URL }}
      VITE_BATTLELOG_PUBLIC_URL: ${{ vars.VITE_BATTLELOG_PUBLIC_URL }}
      VITE_DISCORD_BOT_PERMISSIONS: ${{ vars.VITE_DISCORD_BOT_PERMISSIONS }}
      VITE_DISCORD_CLIENT_ID: ${{ vars.VITE_DISCORD_CLIENT_ID }}
      VITE_GATEWAY_URL: ${{ vars.VITE_GATEWAY_URL }}
      VITE_SEARCH_API_URL: ${{ vars.VITE_SEARCH_API_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun
      - name: Build target
        run: bunx turbo run build --filter='${{ matrix.package }}'
      - name: Deploy target
        env:
          ARTIFACT_PATH: ${{ matrix.artifactPath }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ matrix.kind == 'worker' && secrets.CLOUDFLARE_WORKERS_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CONFIG_PATH: ${{ matrix.configPath }}
          ENVIRONMENT: ${{ matrix.development.environment }}
          KIND: ${{ matrix.kind }}
          PROJECT: ${{ matrix.development.project }}
        run: |
          if [[ "$KIND" == "pages" ]]; then
            bunx wrangler pages deploy "$ARTIFACT_PATH" --project-name "$PROJECT" --branch develop --commit-hash "$GITHUB_SHA" --commit-dirty=false
          else
            bunx wrangler deploy --config "$CONFIG_PATH" --env "$ENVIRONMENT" --keep-vars --message "Deploy $GITHUB_SHA to development"
          fi

  docker:
    name: Build and push ${{ matrix.id }}
    needs: plan
    if: needs.plan.outputs.docker-targets != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.docker-targets) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ matrix.image }}:dev-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=${{ matrix.imageTitle }}
            org.opencontainers.image.description=${{ matrix.imageDescription }}
            org.opencontainers.image.vendor=Lootlog
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            PACKAGE=${{ matrix.package }}
            APP_DIR=${{ matrix.directory }}
            INSTALL_FONTS=${{ matrix.installFonts && '1' || '0' }}
            GITHUB_SHA=${{ github.sha }}
          cache-from: type=gha,scope=docker-${{ matrix.id }}
          cache-to: type=gha,mode=min,scope=docker-${{ matrix.id }}
          provenance: false

  update-gitops:
    name: Update development GitOps
    needs: [plan, docker]
    if: needs.plan.outputs.docker-targets != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.INFRA_REPOSITORY }}
          ref: main
          token: ${{ secrets.INFRA_REPO_PUSH_TOKEN }}
          path: ${{ env.INFRA_REPO_PATH }}
          fetch-depth: 0
      - name: Update affected image tags
        env:
          TARGETS: ${{ needs.plan.outputs.docker-targets }}
        run: |
          while IFS= read -r target; do
            id="$(jq -r '.id' <<< "$target")"
            image="$(jq -r '.image' <<< "$target")"
            tag="dev-$GITHUB_SHA"
            docker run --rm --user "$(id -u):$(id -g)" -e IMAGE="$image" -e TAG="$tag" \
              -v "$PWD/$INFRA_REPO_PATH:/workdir" mikefarah/yq:4.53.3 \
              -i '(.images[] | select(.name == strenv(IMAGE))).newTag = strenv(TAG)' \
              "apps/dev/$id/kustomization.yml"
          done < <(jq -c '.[]' <<< "$TARGETS")
      - name: Commit deployment
        working-directory: ${{ env.INFRA_REPO_PATH }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/dev
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ci: deploy $GITHUB_SHA to development"
          git pull --rebase origin main
          git push origin HEAD:main
