name: Deploy affected services to development

on:
  push:
    branches:
      - main

concurrency:
  group: development-deployment
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  INFRA_REPOSITORY: lootlog/infra
  INFRA_REPO_PATH: infra-repo

jobs:
  plan:
    name: Plan development deployment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      cloudflare-targets: ${{ steps.plan.outputs.cloudflare_targets }}
      docker-services: ${{ steps.plan.outputs.docker_services }}
      version-pull-request: ${{ steps.plan.outputs.version_pull_request }}
    steps:
      - name: Checkout main commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create affected deployment plan
        id: plan
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse "$HEAD_SHA^")"
          fi

          pull_request_heads="$(
            gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls" \
              --jq '[.[].head.ref]'
          )"
          affected="$(
            pnpm exec turbo query affected \
              --base "$BASE_SHA" \
              --head "$HEAD_SHA" \
              --packages
          )"
          affected_packages="$(
            jq -c '[.data.affectedPackages.items[].name]' <<< "$affected"
          )"
          plan="$(
            node tools/ci/create-ci-plan.mjs \
              "$affected_packages" \
              "$pull_request_heads"
          )"

          {
            echo "cloudflare_targets=$(jq -c '.cloudflareTargets' <<< "$plan")"
            echo "docker_services=$(jq -c '.dockerServices' <<< "$plan")"
            echo "version_pull_request=$(jq -r '.versionPullRequest' <<< "$plan")"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Development deployment plan"
            echo
            echo '```json'
            jq . <<< "$plan"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-cloudflare:
    name: Deploy ${{ matrix.project }} to development
    needs: plan
    if: needs.plan.outputs.cloudflare-targets != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.cloudflare-targets) }}
    steps:
      - name: Checkout main commit
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Load Cloudflare preview variables
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PACKAGE_NAME: ${{ matrix.packageName }}
          PROJECT: ${{ matrix.project }}
        run: |
          settings="$(
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT"
          )"

          case "$PACKAGE_NAME" in
            @lootlog/landing)
              keys=(
                NEXT_PUBLIC_ADDON_URL
                NEXT_PUBLIC_AUTH_SERVICE_URL
              )
              ;;
            @lootlog/web)
              keys=(
                VITE_ACTIVITY_API_URL
                VITE_ADDON_INSTALL_URL
                VITE_API_URL
                VITE_AUTH_SERVICE_URL
                VITE_BATTLELOG_API_URL
                VITE_BATTLELOG_PUBLIC_URL
                VITE_DISCORD_BOT_PERMISSIONS
                VITE_DISCORD_CLIENT_ID
                VITE_GATEWAY_URL
                VITE_SEARCH_API_URL
              )
              ;;
            *)
              echo "::error::Unsupported Cloudflare package: $PACKAGE_NAME"
              exit 1
              ;;
          esac

          for key in "${keys[@]}"; do
            value="$(
              jq --exit-status --raw-output \
                --arg key "$key" \
                '.result.deployment_configs.preview.env_vars[$key] | select(.type == "plain_text") | .value' \
                <<< "$settings"
            )"
            if [[ "$value" == *$'\n'* ]]; then
              echo "::error::Cloudflare variable $key contains a newline."
              exit 1
            fi
            echo "$key=$value" >> "$GITHUB_ENV"
          done

      - name: Build development artifact
        env:
          ARTIFACT_PATH: ${{ matrix.artifactPath }}
          PACKAGE_NAME: ${{ matrix.packageName }}
        run: |
          pnpm exec turbo run build --filter="$PACKAGE_NAME"
          test -d "$ARTIFACT_PATH"

      - name: Deploy development artifact
        env:
          ARTIFACT_PATH: ${{ matrix.artifactPath }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PACKAGE_NAME: ${{ matrix.packageName }}
          PROJECT: ${{ matrix.project }}
        run: |
          pnpm exec wrangler pages deploy "$ARTIFACT_PATH" \
            --project-name "$PROJECT" \
            --branch develop \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "Deploy $PACKAGE_NAME to development" \
            --commit-dirty=false

  build-images:
    name: Build and push ${{ matrix.service }}
    needs: plan
    if: needs.plan.outputs.docker-services != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.plan.outputs.docker-services) }}
    steps:
      - name: Checkout main commit
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Build and push immutable development image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.service }}
          push: true
          tags: kamilwronka7/lootlog-${{ matrix.service }}:dev-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            GITHUB_SHA=${{ github.sha }}
            GITHUB_REF=${{ github.ref }}
          cache-from: type=gha,scope=docker-${{ matrix.service }}
          cache-to: type=gha,mode=min,scope=docker-${{ matrix.service }}
          provenance: false

  update-development:
    name: Update development GitOps
    needs:
      - plan
      - build-images
    if: needs.plan.outputs.docker-services != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout infra repository
        uses: actions/checkout@v7
        with:
          repository: ${{ env.INFRA_REPOSITORY }}
          ref: main
          token: ${{ secrets.INFRA_REPO_PUSH_TOKEN }}
          path: ${{ env.INFRA_REPO_PATH }}
          fetch-depth: 0

      - name: Update every affected image
        env:
          SERVICES: ${{ needs.plan.outputs.docker-services }}
        run: |
          while IFS= read -r service; do
            image="kamilwronka7/lootlog-$service"
            tag="dev-$GITHUB_SHA"
            kustomization="$INFRA_REPO_PATH/apps/dev/$service/kustomization.yml"

            docker run --rm \
              --user "$(id -u):$(id -g)" \
              -e IMAGE="$image" \
              -e TAG="$tag" \
              -v "$PWD/$INFRA_REPO_PATH:/workdir" \
              mikefarah/yq:4.53.3 \
              -i '(.images[] | select(.name == strenv(IMAGE))).newTag = strenv(TAG)' \
              "apps/dev/$service/kustomization.yml"

            if ! grep -q "newTag: $tag" "$kustomization"; then
              echo "::error::Failed to update $service to $tag"
              exit 1
            fi
          done < <(jq -r '.[]' <<< "$SERVICES")

      - name: Commit and push one development change
        working-directory: ${{ env.INFRA_REPO_PATH }}
        env:
          SERVICES: ${{ needs.plan.outputs.docker-services }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/dev

          if git diff --cached --quiet; then
            echo "Development already references the requested images."
            exit 0
          fi

          service_list="$(jq -r 'join(", ")' <<< "$SERVICES")"
          git commit \
            -m "ci: deploy main to development" \
            -m "Services: $service_list" \
            -m "Source: $GITHUB_SHA"

          for attempt in {1..5}; do
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              exit 0
            fi

            if [[ "$attempt" -eq 5 ]]; then
              echo "::error::Failed to push the development GitOps update."
              exit 1
            fi
          done
