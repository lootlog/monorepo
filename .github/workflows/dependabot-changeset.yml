name: Add Dependabot changeset

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  actions: write
  contents: write
  pull-requests: read

concurrency:
  group: dependabot-changeset-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changeset:
    name: Generate dependency changeset
    if: |
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted base commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Generate and commit changeset without executing pull request code
        id: changeset
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: bun tools/release/create-dependabot-changeset.mjs

      - name: Dispatch CI for the bot-authored commit
        if: steps.changeset.outputs.changed == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ steps.changeset.outputs.commit_sha }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: bun tools/ci/dispatch-automated-pr-ci.mjs
