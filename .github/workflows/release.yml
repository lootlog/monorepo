name: Release to production

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full commit SHA from main
        required: true
        type: string
      target:
        description: Deployment target
        required: true
        type: choice
        options:
          - activity
          - api
          - auth
          - battlelog-service
          - developer
          - discord-bot
          - gateway
          - search
          - traffic-splitter
          - landing
          - web
          - game-client
          - docs
          - wiki
          - all
      auth_migration_confirmed:
        description: Confirm the Better Auth 1.7 maintenance and migration runbook is complete
        required: true
        default: false
        type: boolean

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read

env:
  INFRA_REPOSITORY: lootlog/infra
  INFRA_REPO_PATH: infra-repo
  PRODUCTION_STATE: apps/prod/lootlog-deployment.json

jobs:
  plan:
    name: Validate release request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
      docker-targets: ${{ steps.plan.outputs.docker_targets }}
      cloudflare-targets: ${{ steps.plan.outputs.cloudflare_targets }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Validate SHA and target
        id: plan
        env:
          AUTH_MIGRATION_CONFIRMED: ${{ inputs.auth_migration_confirmed }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          TARGET: ${{ inputs.target }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::source_sha must be a full lowercase SHA"; exit 1; }
          git fetch origin main
          git cat-file -e "$SOURCE_SHA^{commit}"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main || { echo "::error::source_sha is not on main"; exit 1; }
          plan="$(bun scripts/deployment-targets.mjs "$(jq -cn --arg target "$TARGET" --argjson authMigrationConfirmed "$AUTH_MIGRATION_CONFIRMED" '{mode: "release", target: $target, authMigrationConfirmed: $authMigrationConfirmed}')")"
          {
            echo "targets=$(jq -c '.targets' <<< "$plan")"
            echo "docker_targets=$(jq -c '[.targets[] | select(.kind == "docker")]' <<< "$plan")"
            echo "cloudflare_targets=$(jq -c '[.targets[] | select(.kind != "docker")]' <<< "$plan")"
          } >> "$GITHUB_OUTPUT"
          jq . <<< "$plan" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Build, scan and deploy
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: prod
    env:
      GAME_CLIENT_GAME_CLIENT_URL: ${{ vars.GAME_CLIENT_GAME_CLIENT_URL }}
      GAME_CLIENT_VITE_API_URL: ${{ vars.GAME_CLIENT_VITE_API_URL }}
      GAME_CLIENT_VITE_AUTH_SERVICE_URL: ${{ vars.GAME_CLIENT_VITE_AUTH_SERVICE_URL }}
      GAME_CLIENT_VITE_BATTLELOG_API_URL: ${{ vars.GAME_CLIENT_VITE_BATTLELOG_API_URL }}
      GAME_CLIENT_VITE_GATEWAY_URL: ${{ vars.GAME_CLIENT_VITE_GATEWAY_URL }}
      GAME_CLIENT_VITE_GATEWAY_SOCKET_PATH: /gateway/ws
      GAME_CLIENT_VITE_LOOTLOG_APP_URL: ${{ vars.GAME_CLIENT_VITE_LOOTLOG_APP_URL }}
      LANDING_VITE_ADDON_URL: ${{ vars.LANDING_VITE_ADDON_URL }}
      LANDING_VITE_AUTH_SERVICE_URL: ${{ vars.LANDING_VITE_AUTH_SERVICE_URL }}
      WEB_VITE_ACTIVITY_API_URL: ${{ vars.WEB_VITE_ACTIVITY_API_URL }}
      WEB_VITE_ADDON_INSTALL_URL: ${{ vars.WEB_VITE_ADDON_INSTALL_URL }}
      WEB_VITE_API_URL: ${{ vars.WEB_VITE_API_URL }}
      WEB_VITE_AUTH_SERVICE_URL: ${{ vars.WEB_VITE_AUTH_SERVICE_URL }}
      WEB_VITE_BATTLELOG_API_URL: ${{ vars.WEB_VITE_BATTLELOG_API_URL }}
      WEB_VITE_BATTLELOG_PUBLIC_URL: ${{ vars.WEB_VITE_BATTLELOG_PUBLIC_URL }}
      WEB_VITE_DISCORD_BOT_PERMISSIONS: ${{ vars.WEB_VITE_DISCORD_BOT_PERMISSIONS }}
      WEB_VITE_DISCORD_CLIENT_ID: ${{ vars.WEB_VITE_DISCORD_CLIENT_ID }}
      WEB_VITE_GATEWAY_URL: ${{ vars.WEB_VITE_GATEWAY_URL }}
      WEB_VITE_SEARCH_API_URL: ${{ vars.WEB_VITE_SEARCH_API_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
      - uses: ./.github/actions/setup-bun
      - uses: docker/setup-buildx-action@v4
        if: needs.plan.outputs.docker-targets != '[]'
      - uses: docker/login-action@v4
        if: needs.plan.outputs.docker-targets != '[]'
        with:
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.INFRA_REPOSITORY }}
          ref: main
          token: ${{ secrets.INFRA_REPO_PUSH_TOKEN }}
          path: ${{ env.INFRA_REPO_PATH }}
          fetch-depth: 0

      - name: Initialize deployment state
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          state="$INFRA_REPO_PATH/$PRODUCTION_STATE"
          mkdir -p "$(dirname "$state")"
          if [[ ! -f "$state" ]]; then echo '{"schemaVersion":1,"targets":{}}' > "$state"; fi
          jq -e '.schemaVersion == 1 and (.targets | type == "object")' "$state" >/dev/null
          : > "$RUNNER_TEMP/cloudflare-rollback.jsonl"

      - name: Validate target environment
        env:
          TARGETS: ${{ needs.plan.outputs.targets }}
        run: |
          while IFS= read -r variable; do
            [[ -n "${!variable:-}" ]] || { echo "::error::Missing required production variable: $variable"; exit 1; }
          done < <(jq -r '.[].production.requiredEnvironmentVariables[]?' <<< "$TARGETS")

      - name: Build, scan and push Docker targets
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          TARGETS: ${{ needs.plan.outputs.docker-targets }}
        run: |
          state="$INFRA_REPO_PATH/$PRODUCTION_STATE"
          while IFS= read -r target; do
            id="$(jq -r '.id' <<< "$target")"
            image="$(jq -r '.image' <<< "$target")"
            dockerfile="$(jq -r '.dockerfile' <<< "$target")"
            package_name="$(jq -r '.package' <<< "$target")"
            app_directory="$(jq -r '.directory' <<< "$target")"
            install_fonts="$(jq -r 'if .installFonts == true then "1" else "0" end' <<< "$target")"
            image_title="$(jq -r '.imageTitle' <<< "$target")"
            image_description="$(jq -r '.imageDescription' <<< "$target")"
            reference="$image:sha-$SOURCE_SHA"
            manifest="$(docker buildx imagetools inspect "$reference" --format '{{json .Manifest}}' 2>/dev/null || true)"
            if [[ -n "$manifest" ]]; then
              image_config="$(docker buildx imagetools inspect "$reference" --format '{{json .Image}}')"
              revision="$(jq -er '.config.Labels["org.opencontainers.image.revision"]' <<< "$image_config")"
              [[ "$revision" == "$SOURCE_SHA" ]] || { echo "::error::Existing image revision does not match $SOURCE_SHA: $reference"; exit 1; }
              digest="$(jq -er '.digest' <<< "$manifest")"
              echo "Reusing immutable image: $reference@$digest"
            else
              docker buildx build . --file "$dockerfile" --load --tag "$reference" \
                --build-arg "PACKAGE=$package_name" --build-arg "APP_DIR=$app_directory" \
                --build-arg "INSTALL_FONTS=$install_fonts" --build-arg "GITHUB_SHA=$SOURCE_SHA" \
                --label "org.opencontainers.image.title=$image_title" \
                --label "org.opencontainers.image.description=$image_description" \
                --label "org.opencontainers.image.vendor=Lootlog" \
                --label "org.opencontainers.image.revision=$SOURCE_SHA" \
                --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
                --cache-from "type=gha,scope=docker-$id" --cache-to "type=gha,mode=min,scope=docker-$id"
              docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.74.0 \
                image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL "$reference"
              push_output="$(docker push "$reference")"
              printf '%s\n' "$push_output"
              digest="$(sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' <<< "$push_output" | tail -n 1)"
            fi
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::Registry did not return an image digest"; exit 1; }
            docker run --rm --user "$(id -u):$(id -g)" -e IMAGE="$image" -e TAG="sha-$SOURCE_SHA" \
              -v "$PWD/$INFRA_REPO_PATH:/workdir" mikefarah/yq:4.53.3 \
              -i '(.images[] | select(.name == strenv(IMAGE))).newTag = strenv(TAG)' \
              "apps/prod/$id/kustomization.yml"
            next="$(mktemp)"
            jq --arg digest "$digest" --arg id "$id" --arg image "$image" --arg reference "$reference" \
              --arg sourceSha "$SOURCE_SHA" --arg tag "sha-$SOURCE_SHA" \
              '.targets[$id] = {kind: "docker", image: $image, tag: $tag, digest: $digest, reference: $reference, sourceSha: $sourceSha}' \
              "$state" > "$next"
            mv "$next" "$state"
          done < <(jq -c '.[]' <<< "$TARGETS")

      - name: Build and deploy Cloudflare targets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          TARGETS: ${{ needs.plan.outputs.cloudflare-targets }}
        run: |
          state="$INFRA_REPO_PATH/$PRODUCTION_STATE"
          rollback="$RUNNER_TEMP/cloudflare-rollback.jsonl"
          while IFS= read -r target; do
            id="$(jq -r '.id' <<< "$target")"
            kind="$(jq -r '.kind' <<< "$target")"
            package_name="$(jq -r '.package' <<< "$target")"
            project="$(jq -r '.production.project' <<< "$target")"
            config_path="$(jq -r '.configPath // empty' <<< "$target")"
            artifact_path="$(jq -r '.artifactPath' <<< "$target")"
            case "$package_name" in
              @lootlog/landing)
                export VITE_ADDON_URL="$LANDING_VITE_ADDON_URL"
                export VITE_AUTH_SERVICE_URL="$LANDING_VITE_AUTH_SERVICE_URL"
                ;;
              @lootlog/web)
                export VITE_ACTIVITY_API_URL="$WEB_VITE_ACTIVITY_API_URL"
                export VITE_ADDON_INSTALL_URL="$WEB_VITE_ADDON_INSTALL_URL"
                export VITE_API_URL="$WEB_VITE_API_URL"
                export VITE_AUTH_SERVICE_URL="$WEB_VITE_AUTH_SERVICE_URL"
                export VITE_BATTLELOG_API_URL="$WEB_VITE_BATTLELOG_API_URL"
                export VITE_BATTLELOG_PUBLIC_URL="$WEB_VITE_BATTLELOG_PUBLIC_URL"
                export VITE_DISCORD_BOT_PERMISSIONS="$WEB_VITE_DISCORD_BOT_PERMISSIONS"
                export VITE_DISCORD_CLIENT_ID="$WEB_VITE_DISCORD_CLIENT_ID"
                export VITE_GATEWAY_URL="$WEB_VITE_GATEWAY_URL"
                export VITE_SEARCH_API_URL="$WEB_VITE_SEARCH_API_URL"
                ;;
              @lootlog/game-client)
                export GAME_CLIENT_URL="$GAME_CLIENT_GAME_CLIENT_URL"
                export VITE_API_URL="$GAME_CLIENT_VITE_API_URL"
                export VITE_AUTH_SERVICE_URL="$GAME_CLIENT_VITE_AUTH_SERVICE_URL"
                export VITE_BATTLELOG_API_URL="$GAME_CLIENT_VITE_BATTLELOG_API_URL"
                export VITE_GATEWAY_URL="$GAME_CLIENT_VITE_GATEWAY_URL"
                export VITE_GATEWAY_SOCKET_PATH="$GAME_CLIENT_VITE_GATEWAY_SOCKET_PATH"
                export VITE_LOOTLOG_APP_URL="$GAME_CLIENT_VITE_LOOTLOG_APP_URL"
                ;;
            esac
            bunx turbo run build --filter="$package_name"

            if [[ "$kind" == "pages" ]]; then
              previous_id="$(bunx wrangler pages deployment list --project-name "$project" --environment production --json | jq -r '.[0].Id')"
              jq -cn --arg id "$id" --arg kind "$kind" --arg previousId "$previous_id" --arg project "$project" \
                '{id: $id, kind: $kind, previousId: $previousId, project: $project}' >> "$rollback"
              bunx wrangler pages deploy "$artifact_path" --project-name "$project" --branch main \
                --commit-hash "$SOURCE_SHA" --commit-message "Deploy $package_name from $SOURCE_SHA" --commit-dirty=false
              deployment_id="$(bunx wrangler pages deployment list --project-name "$project" --environment production --json | jq -r '.[0].Id')"
            else
              previous_id="$(bunx wrangler deployments list --config "$config_path" --env="" --name "$project" --json | jq -r 'sort_by(.created_on) | last | .versions[] | select(.percentage == 100) | .version_id' | head -n 1)"
              jq -cn --arg configPath "$config_path" --arg id "$id" --arg kind "$kind" --arg previousId "$previous_id" --arg project "$project" \
                '{configPath: $configPath, id: $id, kind: $kind, previousId: $previousId, project: $project}' >> "$rollback"
              if [[ "$id" == "traffic-splitter" ]]; then
                bunx wrangler deploy "$artifact_path/index.js" --config "$config_path" --env="" --name "$project" --keep-vars
              elif [[ "$id" == "wiki" ]]; then
                bunx wrangler deploy "$artifact_path/server/index.js" --config "$config_path" --env="" --name "$project" --assets "$artifact_path/client" --keep-vars
              else
                bunx wrangler deploy --config "$config_path" --env="" --name "$project" --keep-vars
              fi
              deployment_id="$(bunx wrangler deployments list --config "$config_path" --env="" --name "$project" --json | jq -r 'sort_by(.created_on) | last | .versions[] | select(.percentage == 100) | .version_id' | head -n 1)"
            fi

            next="$(mktemp)"
            jq --arg configPath "$config_path" --arg deploymentId "$deployment_id" --arg id "$id" \
              --arg kind "$kind" --arg project "$project" --arg sourceSha "$SOURCE_SHA" \
              '.targets[$id] = {kind: $kind, project: $project, configPath: $configPath, deploymentId: $deploymentId, sourceSha: $sourceSha}' \
              "$state" > "$next"
            mv "$next" "$state"
          done < <(jq -c 'sort_by(.order)[]' <<< "$TARGETS")

      - name: Enable Developer Portal after its first release
        env:
          TARGETS: ${{ needs.plan.outputs.targets }}
        run: |
          if jq -e '.[] | select(.id == "developer")' <<< "$TARGETS" >/dev/null && \
             ! grep -qE '^[[:space:]]*-[[:space:]]+developer$' "$INFRA_REPO_PATH/apps/prod/kustomization.yml"; then
            docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/$INFRA_REPO_PATH:/workdir" \
              mikefarah/yq:4.53.3 -i '.resources += ["developer"]' apps/prod/kustomization.yml
          fi

      - name: Commit production state
        working-directory: ${{ env.INFRA_REPO_PATH }}
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/prod
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ci: deploy $SOURCE_SHA to production"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Roll back partial Cloudflare deployment
        if: failure() && needs.plan.outputs.cloudflare-targets != '[]'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          rollback="$RUNNER_TEMP/cloudflare-rollback.jsonl"
          [[ -s "$rollback" ]] || exit 0
          while IFS= read -r item; do
            kind="$(jq -r '.kind' <<< "$item")"
            previous_id="$(jq -r '.previousId' <<< "$item")"
            project="$(jq -r '.project' <<< "$item")"
            if [[ "$kind" == "pages" ]]; then
              curl --fail-with-body --silent --show-error --request POST \
                --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" --header "Content-Type: application/json" --data '{}' \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$project/deployments/$previous_id/rollback"
            else
              bunx wrangler rollback "$previous_id" --config "$(jq -r '.configPath' <<< "$item")" \
                --env="" --name "$project" --message "Rollback failed release $GITHUB_SHA" --yes
            fi
          done < <(tac "$rollback")
