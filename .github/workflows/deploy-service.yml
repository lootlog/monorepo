name: Reusable Service Deployment

on:
  workflow_call:
    inputs:
      service:
        description: "Service name (api, auth, gateway, etc.)"
        required: true
        type: string
      environment:
        description: "Deployment environment (dev, prod)"
        required: true
        type: string
      docker_target:
        description: "Docker build target (defaults to service name)"
        required: false
        type: string
      enable_notifications:
        description: "Enable deployment notifications"
        required: false
        type: boolean
        default: false
      notification_webhook:
        description: "Discord/Slack webhook for notifications"
        required: false
        type: string
    secrets:
      DOCKER_REGISTRY_USERNAME:
        required: true
      DOCKER_REGISTRY_PASSWORD:
        required: true
      INFRA_REPO_PUSH_TOKEN:
        required: true

permissions:
  contents: write
  security-events: write

env:
  IMAGE_NAME: kamilwronka7/lootlog-${{ inputs.service }}
  IMAGE_TAG: ${{ inputs.environment }}-${{ github.sha }}
  INFRA_REPOSITORY: lootlog/infra
  INFRA_REPO_PATH: infra-repo
  KUSTOMIZE_PATH: apps/${{ inputs.environment }}/${{ inputs.service }}/kustomization.yml
  DOCKER_TARGET: ${{ inputs.docker_target || inputs.service }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint --filter=@lootlog/${{ inputs.service }}

      - name: Run tests
        run: pnpm test --filter=@lootlog/${{ inputs.service }}

  build-and-push:
    name: Build, Scan & Push
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.IMAGE_TAG }}
            type=raw,value=${{ inputs.environment }}-latest
            type=sha,prefix=${{ inputs.environment }}-

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ env.DOCKER_TARGET }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GITHUB_SHA=${{ github.sha }}
            GITHUB_REF=${{ github.ref }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:${{ inputs.environment }}-buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:${{ inputs.environment }}-buildcache,mode=max
          provenance: false

      # - name: Run Trivy vulnerability scanner
      #   uses: aquasecurity/trivy-action@0.33.1
      #   with:
      #     image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
      #     format: "sarif"
      #     output: "trivy-results.sarif"
      #     severity: "CRITICAL,HIGH"
      #     exit-code: "1"
      #     ignore-unfixed: true

      # - name: Upload Trivy results to GitHub Security
      #   uses: github/codeql-action/upload-sarif@v4
      #   if: always()
      #   with:
      #     sarif_file: "trivy-results.sarif"

  update-kustomize:
    name: Update Kustomize
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 10

    steps:
      - name: Checkout infra repository
        uses: actions/checkout@v5
        with:
          repository: ${{ env.INFRA_REPOSITORY }}
          ref: ${{ inputs.environment == 'prod' && 'main' || 'develop' }}
          token: ${{ secrets.INFRA_REPO_PUSH_TOKEN }}
          path: ${{ env.INFRA_REPO_PATH }}
          fetch-depth: 0

      - name: Update kustomization.yaml image tag
        uses: mikefarah/yq@v4.52.2
        with:
          cmd: yq e '( .images[] | select(.name == strenv(IMAGE_NAME)) ).newTag = strenv(IMAGE_TAG)' -i ${{ env.INFRA_REPO_PATH }}/${{ env.KUSTOMIZE_PATH }}

      - name: Commit and push with retry
        run: |
          cd ${{ env.INFRA_REPO_PATH }}

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add ${{ env.KUSTOMIZE_PATH }}

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "ci: update ${{ inputs.service }} image to ${{ env.IMAGE_TAG }}"

          BRANCH="${{ inputs.environment == 'prod' && 'main' || 'develop' }}"

          for i in {1..5}; do
            echo "Push attempt $i/5"
            git fetch origin $BRANCH

            if ! git rebase origin/$BRANCH; then
              echo "Rebase failed"
              exit 1
            fi

            if git push origin HEAD:$BRANCH; then
              echo "Push successful"
              exit 0
            fi

            echo "Push failed, retrying in 5 seconds..."
            sleep 5
          done

          echo "Failed to push after 5 attempts"
          exit 1

  notify:
    name: Send Notification
    runs-on: ubuntu-latest
    needs: [test, build-and-push, update-kustomize]
    if: always() && inputs.enable_notifications && inputs.notification_webhook != ''
    timeout-minutes: 5

    steps:
      - name: Determine status
        id: status
        run: |
          if [[ "${{ needs.test.result }}" == "failure" ]] || \
             [[ "${{ needs.build-and-push.result }}" == "failure" ]] || \
             [[ "${{ needs.update-kustomize.result }}" == "failure" ]]; then
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "color=15158332" >> $GITHUB_OUTPUT
          else
            echo "status=success" >> $GITHUB_OUTPUT
            echo "color=3066993" >> $GITHUB_OUTPUT
          fi

      - name: Send notification
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ inputs.notification_webhook }}
          title: "Deployment: ${{ inputs.service }} to ${{ inputs.environment }}"
          description: |
            **Service**: ${{ inputs.service }}
            **Environment**: ${{ inputs.environment }}
            **Status**: ${{ steps.status.outputs.status }}
            **Image**: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            **Commit**: ${{ github.sha }}
          color: ${{ steps.status.outputs.color }}
          username: "GitHub Actions"
