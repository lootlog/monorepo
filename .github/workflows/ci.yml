name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:
    inputs:
      base_sha:
        description: Base commit used for affected package detection
        required: true
        type: string
      head_sha:
        description: Head commit to validate
        required: true
        type: string
      pull_request_number:
        description: Pull request associated with an automated dispatch
        required: false
        type: string

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.merge_group.head_ref || inputs.pull_request_number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  plan:
    name: Plan affected CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      base-sha: ${{ steps.context.outputs.base_sha }}
      head-sha: ${{ steps.context.outputs.head_sha }}
      packages: ${{ steps.plan.outputs.packages }}
      docker-services: ${{ steps.plan.outputs.docker_services }}
      run-api-client-check: ${{ steps.plan.outputs.run_api_client_check }}
      version-pull-request: ${{ steps.plan.outputs.version_pull_request }}
    steps:
      - name: Checkout validation commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve validation context
        id: context
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SHA: ${{ github.sha }}
          INPUT_BASE_SHA: ${{ inputs.base_sha }}
          INPUT_HEAD_SHA: ${{ inputs.head_sha }}
          INPUT_PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PULL_REQUEST_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$EVENT_NAME" in
            pull_request)
              base_sha="$PULL_REQUEST_BASE_SHA"
              head_sha="$PULL_REQUEST_HEAD_SHA"
              pull_request_heads="$(jq -cn --arg head "$PULL_REQUEST_HEAD_REF" '[$head]')"
              ;;
            merge_group)
              base_sha="$MERGE_GROUP_BASE_SHA"
              head_sha="$MERGE_GROUP_HEAD_SHA"
              pull_request_number="$(
                node tools/ci/merge-group-pull-request.mjs \
                  "$MERGE_GROUP_HEAD_REF"
              )"
              pull_request_heads="$(
                gh pr view "$pull_request_number" \
                  --json headRefName \
                  --jq '[.headRefName]'
              )"
              ;;
            workflow_dispatch)
              base_sha="$INPUT_BASE_SHA"
              if [[ "$INPUT_HEAD_SHA" != "$DISPATCH_SHA" ]]; then
                echo "::error::Dispatched head_sha does not match the selected ref."
                exit 1
              fi
              head_sha="$DISPATCH_SHA"
              if [[ -n "$INPUT_PULL_REQUEST_NUMBER" ]]; then
                pull_request_heads="$(
                  gh pr view "$INPUT_PULL_REQUEST_NUMBER" \
                    --json headRefName \
                    --jq '[.headRefName]'
                )"
              else
                pull_request_heads="$(
                  gh api "repos/$GITHUB_REPOSITORY/commits/$head_sha/pulls" \
                    --jq '[.[].head.ref]'
                )"
              fi
              ;;
            *)
              echo "::error::Unsupported event: $EVENT_NAME"
              exit 1
              ;;
          esac

          git cat-file -e "$base_sha^{commit}"
          git cat-file -e "$head_sha^{commit}"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "pull_request_heads=$(jq -c . <<< "$pull_request_heads")" >> "$GITHUB_OUTPUT"

      - name: Create affected CI plan
        id: plan
        env:
          BASE_SHA: ${{ steps.context.outputs.base_sha }}
          HEAD_SHA: ${{ steps.context.outputs.head_sha }}
          PULL_REQUEST_HEADS: ${{ steps.context.outputs.pull_request_heads }}
        run: |
          affected="$(
            bunx turbo query affected \
              --base "$BASE_SHA" \
              --head "$HEAD_SHA" \
              --packages
          )"
          affected_packages="$(
            jq -c '[.data.affectedPackages.items[].name]' <<< "$affected"
          )"
          plan="$(
            node tools/ci/create-ci-plan.mjs \
              "$affected_packages" \
              "$PULL_REQUEST_HEADS"
          )"

          echo "packages=$(jq -c '.packages' <<< "$plan")" >> "$GITHUB_OUTPUT"
          echo "docker_services=$(jq -c '.dockerServices' <<< "$plan")" >> "$GITHUB_OUTPUT"
          echo "run_api_client_check=$(jq -r '.runApiClientCheck' <<< "$plan")" >> "$GITHUB_OUTPUT"
          echo "version_pull_request=$(jq -r '.versionPullRequest' <<< "$plan")" >> "$GITHUB_OUTPUT"

          {
            echo "## Affected CI plan"
            echo
            echo '```json'
            jq . <<< "$plan"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  quality:
    name: Affected quality checks
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout validation commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || needs.plan.outputs.head-sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test CI and release tooling
        run: node --test tools/release/*.test.mjs apps/developer/server-handler.test.js

      - name: Validate changesets
        if: needs.plan.outputs.version-pull-request != 'true'
        run: node tools/release/validate-workspace-changesets.mjs "${{ needs.plan.outputs.base-sha }}"

      - name: Check formatting
        run: bun run format:check

      - name: Check dependencies
        run: bun run deps:check

      - name: Lint, typecheck, and build affected workspaces
        env:
          PACKAGES: ${{ needs.plan.outputs.packages }}
        run: |
          mapfile -t filters < <(jq -r '.[] | "--filter=" + .' <<< "$PACKAGES")
          if [[ "${#filters[@]}" -eq 0 ]]; then
            echo "No affected workspaces."
            exit 0
          fi
          bunx turbo run lint typecheck build "${filters[@]}"

      - name: Test affected workspaces except Game Client
        env:
          PACKAGES: ${{ needs.plan.outputs.packages }}
        run: |
          mapfile -t filters < <(
            jq -r '.[] | select(. != "@lootlog/game-client") | "--filter=" + .' <<< "$PACKAGES"
          )
          if [[ "${#filters[@]}" -eq 0 ]]; then
            echo "No non-Game Client tests to run."
            exit 0
          fi
          bunx turbo run test "${filters[@]}"

      - name: Test Game Client coverage
        if: contains(fromJSON(needs.plan.outputs.packages), '@lootlog/game-client')
        env:
          COVERAGE_BASE_REF: ${{ needs.plan.outputs.base-sha }}
        run: |
          bun run --filter=@lootlog/game-client typecheck
          bun run --filter=@lootlog/game-client test:coverage
          bun run --filter=@lootlog/game-client test:coverage:changed

      - name: Upload Game Client coverage
        if: always() && contains(fromJSON(needs.plan.outputs.packages), '@lootlog/game-client')
        uses: codecov/codecov-action@v6
        with:
          files: ./apps/game-client/coverage/lcov.info
          flags: game-client
          name: game-client-coverage

      - name: Regenerate and check API clients
        if: needs.plan.outputs.run-api-client-check == 'true'
        env:
          PORT: "4000"
          RABBITMQ_URI: amqp://guest:guest@localhost:5672
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          REDIS_PASSWORD: ci
          REDIS_USERNAME: default
          AUTH_SERVICE_URL: http://localhost:4001
          RESERVATIONS_CARDS_URL: http://localhost:4000/reservations/cards
          MAPS_API_URL: http://localhost:4000/maps
          TRUSTED_ORIGINS: http://localhost
          COOKIE_DOMAIN: localhost
          COOKIE_PREFIX: lootlog-ci
          ADMIN_ACCOUNT_IDS: ci-admin
          AUTH_SECRET: ci-openapi-generation-secret
          APP_URL: http://localhost:4001
          POSTGRESQL_CONNECTION_URI: postgresql://postgres:postgres@localhost:5432/lootlog
          POSTGRESQL_PORT: "5432"
          POSTGRESQL_HOST: localhost
          POSTGRESQL_USER: postgres
          POSTGRESQL_PASSWORD: postgres
          POSTGRESQL_DATABASE: lootlog
          DISCORD_CLIENT_SECRET: ci
          DISCORD_CLIENT_ID: ci
          MEILISEARCH_HOST: http://localhost:7700
          MEILISEARCH_API_KEY: ci
          R2_ACCESS_KEY_ID: ci
          R2_SECRET_ACCESS_KEY: ci
          R2_ENDPOINT: http://localhost
          R2_BUCKET_NAME: ci
          API_SERVICE_URL: http://localhost:4000
        run: bun run api-client:check

  docker:
    name: Docker ${{ matrix.service }}
    needs: plan
    if: needs.plan.outputs.docker-services != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.plan.outputs.docker-services) }}
    steps:
      - name: Checkout validation commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || needs.plan.outputs.head-sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build affected Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.service }}
          push: false
          load: true
          tags: lootlog-${{ matrix.service }}:ci
          build-args: |
            GITHUB_SHA=${{ needs.plan.outputs.head-sha }}
            GITHUB_REF=${{ github.ref }}
          pull: true
          no-cache-filters: runtime-base
          cache-from: ${{ github.event_name != 'workflow_dispatch' && format('type=gha,scope=docker-{0}', matrix.service) || '' }}
          cache-to: ${{ github.event_name != 'workflow_dispatch' && format('type=gha,mode=min,scope=docker-{0}', matrix.service) || '' }}
          provenance: false

      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          image-ref: lootlog-${{ matrix.service }}:ci
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          limit-severities-for-sarif: true

      - name: Upload Trivy results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ matrix.service }}

  ci-success:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Automated CI result' || 'CI Success' }}
    needs:
      - plan
      - quality
      - docker
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check every CI result
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e '
            all(
              .[];
              .result == "success" or .result == "skipped"
            )
          ' <<< "$JOB_RESULTS"

  publish-automated-status:
    name: Publish automated CI status
    needs:
      - plan
      - ci-success
    if: always() && github.event_name == 'workflow_dispatch'
    permissions:
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish required status
        env:
          CI_RESULT: ${{ needs.ci-success.result }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.plan.outputs.head-sha }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          state="failure"
          description="Automated CI failed."
          if [[ "$CI_RESULT" == "success" ]]; then
            state="success"
            description="Automated CI passed."
          fi

          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            --raw-field state="$state" \
            --raw-field context="CI Success" \
            --raw-field description="$description" \
            --raw-field target_url="$TARGET_URL"
