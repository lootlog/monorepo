name: Continuous Integration

on:
  pull_request:
    branches: [main]
  # Main runs every workspace check once so pull requests start from its Turbo
  # cache instead of an empty one.
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  plan:
    name: Plan affected checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      base-sha: ${{ steps.plan.outputs.base_sha }}
      packages: ${{ steps.plan.outputs.packages }}
      workspace-shards: ${{ steps.plan.outputs.workspace_shards }}
      integration-packages: ${{ steps.plan.outputs.integration_packages }}
      docker-targets: ${{ steps.plan.outputs.docker_targets }}
      run-client-check: ${{ steps.plan.outputs.run_client_check }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Create plan
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            affected_packages="$(bunx turbo@2.11.7 ls --output=json | jq -c '[.packages.items[].name]')"
            list_changed_files() { :; }
          else
            affected="$(bunx turbo@2.11.7 query affected --base "$BASE_SHA" --head "$HEAD_SHA" --packages)"
            affected_packages="$(jq -c '[.data.affectedPackages.items[].name]' <<< "$affected")"
            list_changed_files() { git diff --name-only -z "$BASE_SHA" "$HEAD_SHA"; }
          fi
          # Stream the paths through stdin: large diffs exceed the argument size limit.
          plan="$(
            list_changed_files |
              jq -Rsc --argjson affectedPackages "$affected_packages" \
                '{mode: "ci", affectedPackages: $affectedPackages, changedFiles: (split("\u0000") | map(select(length > 0)))}' |
              bun scripts/deployment-targets.mjs
          )"
          {
            echo "base_sha=$BASE_SHA"
            echo "packages=$(jq -c '.packages' <<< "$plan")"
            echo "workspace_shards=$(jq -c '.workspaceShards' <<< "$plan")"
            echo "integration_packages=$(jq -c '.integrationPackages' <<< "$plan")"
            echo "docker_targets=$(jq -c '.dockerTargets' <<< "$plan")"
            echo "run_client_check=$(jq -r '.runClientCheck' <<< "$plan")"
          } >> "$GITHUB_OUTPUT"
          jq . <<< "$plan" >> "$GITHUB_STEP_SUMMARY"

  repository:
    name: Repository checks
    needs: plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
      - run: bun test scripts/deployment-targets.test.mjs scripts/static-assets.test.mjs
      - run: bun run format:check
      - run: bun run deps:check
      - name: Check workflow syntax
        uses: docker://rhysd/actionlint:1.7.12

  workspaces:
    name: Workspace checks (${{ matrix.id }})
    needs: plan
    if: needs.plan.outputs.workspace-shards != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.workspace-shards) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
        with:
          turbo-cache-scope: ci-workspaces-${{ matrix.id }}
      # Turbo never evicts entries, so main saves only what this commit produced
      # instead of growing the restored cache on every push.
      - name: Start main's Turbo cache from this commit
        if: github.event_name == 'push'
        run: rm -rf .turbo
      - name: Lint, typecheck, test, end-to-end test and build
        env:
          TURBO_SCM_BASE: ${{ needs.plan.outputs.base-sha }}
          TURBO_SCM_HEAD: ${{ github.sha }}
          FILTERS: ${{ toJSON(matrix.filters) }}
        run: |
          mapfile -t args < <(jq -r '.[] | "--filter=" + .' <<< "$FILTERS")
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            args+=(--affected)
          fi
          bunx turbo run lint typecheck test test:e2e build "${args[@]}"

  integration:
    name: Affected integration tests
    needs: plan
    if: github.event_name == 'pull_request' && needs.plan.outputs.integration-packages != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
        with:
          turbo-cache-scope: ci-integration
      - name: Run self-contained integration tests
        env:
          PACKAGES: ${{ needs.plan.outputs.integration-packages }}
        run: |
          mapfile -t filters < <(jq -r '.[] | "--filter=" + .' <<< "$PACKAGES")
          # Each suite starts its own Postgres/Redis/RabbitMQ containers through
          # testcontainers. Running packages in parallel puts a dozen containers
          # on one runner, and the 5s test timeouts start expiring in whichever
          # suite loses the race. Keep the packages serial; each one already
          # parallelises internally where it is safe to.
          bunx turbo run test:integration --concurrency=1 "${filters[@]}"

  generated-client:
    name: Generated API client
    needs: plan
    if: github.event_name == 'pull_request' && needs.plan.outputs.run-client-check == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
        with:
          turbo-cache-scope: ci-generated-client
      - run: bun run client:check
      - name: Verify public package installation
        working-directory: packages/sdk
        run: bun run test:package

  docker:
    name: Docker ${{ matrix.id }}
    needs: plan
    if: github.event_name == 'pull_request' && needs.plan.outputs.docker-targets != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.docker-targets) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build packaging-sensitive image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: lootlog-${{ matrix.id }}:ci
          labels: |
            org.opencontainers.image.title=${{ matrix.imageTitle }}
            org.opencontainers.image.description=${{ matrix.imageDescription }}
            org.opencontainers.image.vendor=Lootlog
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            PACKAGE=${{ matrix.package }}
            APP_DIR=${{ matrix.directory }}
            INSTALL_FONTS=${{ matrix.installFonts && '1' || '0' }}
            GITHUB_SHA=${{ github.sha }}
          cache-from: type=gha,scope=docker-${{ matrix.id }}
          cache-to: type=gha,mode=min,scope=docker-${{ matrix.id }}
          provenance: false

  ci-success:
    name: CI Success
    needs: [plan, repository, workspaces, integration, generated-client, docker]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every applicable job
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$JOB_RESULTS"
