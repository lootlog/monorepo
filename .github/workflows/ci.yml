name: Continuous Integration

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: Plan affected checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      base-sha: ${{ steps.plan.outputs.base_sha }}
      packages: ${{ steps.plan.outputs.packages }}
      integration-packages: ${{ steps.plan.outputs.integration_packages }}
      docker-targets: ${{ steps.plan.outputs.docker_targets }}
      run-client-check: ${{ steps.plan.outputs.run_client_check }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Create plan
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          affected="$(bunx turbo@2.10.12 query affected --base "$BASE_SHA" --head "$HEAD_SHA" --packages)"
          affected_packages="$(jq -c '[.data.affectedPackages.items[].name]' <<< "$affected")"
          plan="$(
            git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" |
              jq -Rsc --argjson affectedPackages "$affected_packages" \
                '{mode: "ci", affectedPackages: $affectedPackages, changedFiles: (split("\u0000") | map(select(length > 0)))}' |
              bun scripts/deployment-targets.mjs
          )"
          {
            echo "base_sha=$BASE_SHA"
            echo "packages=$(jq -c '.packages' <<< "$plan")"
            echo "integration_packages=$(jq -c '.integrationPackages' <<< "$plan")"
            echo "docker_targets=$(jq -c '.dockerTargets' <<< "$plan")"
            echo "run_client_check=$(jq -r '.runClientCheck' <<< "$plan")"
          } >> "$GITHUB_OUTPUT"
          jq . <<< "$plan" >> "$GITHUB_STEP_SUMMARY"

  repository:
    name: Repository checks
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
      - run: bun test scripts/deployment-targets.test.mjs
      - run: bun run format:check
      - run: bun run deps:check
      - name: Check workflow syntax
        uses: docker://rhysd/actionlint:1.7.7

  workspaces:
    name: Affected workspace checks
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
      - name: Lint, typecheck, test and build
        env:
          TURBO_SCM_BASE: ${{ needs.plan.outputs.base-sha }}
          TURBO_SCM_HEAD: ${{ github.sha }}
        run: bunx turbo run lint typecheck test build --affected

  integration:
    name: Affected integration tests
    needs: plan
    if: needs.plan.outputs.integration-packages != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
      - name: Run self-contained integration tests
        env:
          PACKAGES: ${{ needs.plan.outputs.integration-packages }}
        run: |
          mapfile -t filters < <(jq -r '.[] | "--filter=" + .' <<< "$PACKAGES")
          bunx turbo run test:integration "${filters[@]}"

  generated-client:
    name: Generated API client
    needs: plan
    if: needs.plan.outputs.run-client-check == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
      - run: bun run client:check

  docker:
    name: Docker ${{ matrix.id }}
    needs: plan
    if: needs.plan.outputs.docker-targets != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.docker-targets) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build packaging-sensitive image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: lootlog-${{ matrix.id }}:ci
          labels: |
            org.opencontainers.image.title=${{ matrix.imageTitle }}
            org.opencontainers.image.description=${{ matrix.imageDescription }}
            org.opencontainers.image.vendor=Lootlog
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            PACKAGE=${{ matrix.package }}
            APP_DIR=${{ matrix.directory }}
            INSTALL_FONTS=${{ matrix.installFonts && '1' || '0' }}
            GITHUB_SHA=${{ github.sha }}
          cache-from: type=gha,scope=docker-${{ matrix.id }}
          cache-to: type=gha,mode=min,scope=docker-${{ matrix.id }}
          provenance: false

  ci-success:
    name: CI Success
    needs: [plan, repository, workspaces, integration, generated-client, docker]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every applicable job
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$JOB_RESULTS"
