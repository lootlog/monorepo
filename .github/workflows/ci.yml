name: Continuous Integration

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.filter.outputs.api }}
      auth: ${{ steps.filter.outputs.auth }}
      gateway: ${{ steps.filter.outputs.gateway }}
      discord-bot: ${{ steps.filter.outputs.discord-bot }}
      search: ${{ steps.filter.outputs.search }}
      battlelog-service: ${{ steps.filter.outputs.battlelog-service }}
      developer: ${{ steps.filter.outputs.developer }}
      game-client: ${{ steps.filter.outputs.game-client }}
      packages: ${{ steps.filter.outputs.packages }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check for file changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/**'
            auth:
              - 'apps/auth/**'
              - 'packages/**'
            gateway:
              - 'apps/gateway/**'
              - 'packages/**'
            discord-bot:
              - 'apps/discord-bot/**'
              - 'packages/**'
            search:
              - 'apps/search/**'
              - 'packages/**'
            battlelog-service:
              - 'apps/battlelog-service/**'
              - 'packages/**'
            developer:
              - 'apps/developer/**'
              - 'packages/**'
            game-client:
              - 'apps/game-client/**'
              - 'packages/margonem/**'
              - 'packages/socket-parser/**'
              - 'packages/types/**'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
            packages:
              - 'packages/**'

  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.api == 'true' ||
      needs.changes.outputs.auth == 'true' ||
      needs.changes.outputs.gateway == 'true' ||
      needs.changes.outputs.discord-bot == 'true' ||
      needs.changes.outputs.search == 'true' ||
      needs.changes.outputs.battlelog-service == 'true' ||
      needs.changes.outputs.developer == 'true' ||
      needs.changes.outputs.game-client == 'true' ||
      needs.changes.outputs.packages == 'true'
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

  test-api:
    name: Test API
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.api == 'true'
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test --filter=@lootlog/api

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        if: always()
        with:
          files: ./apps/api/coverage/lcov.info
          flags: api
          name: api-coverage

  test-auth:
    name: Test Auth
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.auth == 'true'
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test --filter=@lootlog/auth

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        if: always()
        with:
          files: ./apps/auth/coverage/lcov.info
          flags: auth
          name: auth-coverage

  test-gateway:
    name: Test Gateway
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test --filter=@lootlog/gateway

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        if: always()
        with:
          files: ./apps/gateway/coverage/lcov.info
          flags: gateway
          name: gateway-coverage

  test-discord-bot:
    name: Test Discord Bot
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.discord-bot == 'true'
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test --filter=@lootlog/discord-bot

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        if: always()
        with:
          files: ./apps/discord-bot/coverage/lcov.info
          flags: discord-bot
          name: discord-bot-coverage

  test-search:
    name: Test Search
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.search == 'true'
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test --filter=@lootlog/search

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        if: always()
        with:
          files: ./apps/search/coverage/lcov.info
          flags: search
          name: search-coverage

  test-battlelog-service:
    name: Test Battlelog Service
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.battlelog-service == 'true'
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test --filter=@lootlog/battlelog-service

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        if: always()
        with:
          files: ./apps/battlelog-service/coverage/lcov.info
          flags: battlelog-service
          name: battlelog-service-coverage

  test-game-client:
    name: Test Game Client Performance
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.game-client == 'true'
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm --filter=@lootlog/game-client check-types

      - name: Run coverage suite
        run: pnpm --filter=@lootlog/game-client test:coverage

      - name: Enforce changed-code coverage
        if: github.event_name == 'pull_request'
        env:
          COVERAGE_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: pnpm --filter=@lootlog/game-client check:changed-coverage

      - name: Build release userscript and enforce bundle budget
        run: pnpm --filter=@lootlog/game-client build

      - name: Measure base hot paths
        id: base-benchmark
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base_worktree="$RUNNER_TEMP/game-client-base"
          base_output="$RUNNER_TEMP/game-client-base-benchmark"
          git worktree add --detach "$base_worktree" "$BASE_SHA"
          if [[ -f "$base_worktree/apps/game-client/benchmarks/hot-paths/run-hot-path-benchmarks.ts" ]]; then
            pnpm --dir "$base_worktree" install --frozen-lockfile
            BENCH_OUTPUT_DIR="$base_output" pnpm --dir "$base_worktree" --filter=@lootlog/game-client bench:hot-paths
            echo "baseline_path=$base_output/hot-paths.json" >> "$GITHUB_OUTPUT"
          else
            echo "Benchmark harness is not present on the base commit; using the measured legacy baseline."
            echo "baseline_path=$GITHUB_WORKSPACE/apps/game-client/benchmarks/hot-paths/legacy-baseline.json" >> "$GITHUB_OUTPUT"
          fi
          git worktree remove "$base_worktree" --force

      - name: Run candidate hot-path benchmarks
        env:
          BENCH_BASELINE: ${{ steps.base-benchmark.outputs.baseline_path }}
        run: pnpm --filter=@lootlog/game-client bench:hot-paths

      - name: Run retained-heap soak
        run: pnpm --filter=@lootlog/game-client bench:soak

      - name: Run Chromium performance matrix
        env:
          BROWSER_PERF_CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
          BROWSER_PERF_ENFORCE: "1"
        run: pnpm --filter=@lootlog/game-client test:browser-perf

      - name: Upload game-client performance artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: game-client-performance
          path: |
            apps/game-client/artifacts/hot-path-benchmarks
            apps/game-client/artifacts/retained-heap-soak
            apps/game-client/artifacts/browser-perf

      - name: Upload game-client coverage
        if: always()
        uses: codecov/codecov-action@v6
        with:
          files: ./apps/game-client/coverage/lcov.info
          flags: game-client
          name: game-client-coverage

  build:
    name: Build All Services
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.api == 'true' ||
      needs.changes.outputs.auth == 'true' ||
      needs.changes.outputs.gateway == 'true' ||
      needs.changes.outputs.discord-bot == 'true' ||
      needs.changes.outputs.search == 'true' ||
      needs.changes.outputs.battlelog-service == 'true' ||
      needs.changes.outputs.developer == 'true' ||
      needs.changes.outputs.game-client == 'true' ||
      needs.changes.outputs.packages == 'true'
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages and services
        run: pnpm build

  docker-build:
    name: Test Docker Build
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.api == 'true' ||
      needs.changes.outputs.auth == 'true' ||
      needs.changes.outputs.gateway == 'true' ||
      needs.changes.outputs.discord-bot == 'true' ||
      needs.changes.outputs.search == 'true' ||
      needs.changes.outputs.battlelog-service == 'true' ||
      needs.changes.outputs.developer == 'true' ||
      needs.changes.outputs.game-client == 'true' ||
      needs.changes.outputs.packages == 'true'
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker images (no push)
        run: |
          services=(api auth gateway discord-bot search battlelog-service developer)
          for service in "${services[@]}"; do
            echo "Building $service..."
            docker build \
              --target $service \
              --cache-from type=registry,ref=kamilwronka7/lootlog-$service:dev-buildcache \
              --tag lootlog-$service:test \
              .
          done

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint, test-game-client, build, docker-build]
    if: always()
    timeout-minutes: 5

    steps:
      - name: Check job results
        run: |
          if [[ "${{ needs.lint.result }}" == "failure" ]] || \
             [[ "${{ needs.test-game-client.result }}" == "failure" ]] || \
             [[ "${{ needs.build.result }}" == "failure" ]] || \
             [[ "${{ needs.docker-build.result }}" == "failure" ]]; then
            echo "CI failed"
            exit 1
          fi
          echo "CI passed"
