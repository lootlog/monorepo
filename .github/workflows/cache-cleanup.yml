name: Clean pull request caches

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Remove closed pull request caches
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete pull request caches
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          gh cache delete \
            --all \
            --succeed-on-no-caches \
            --ref "$PULL_REQUEST_REF" \
            --repo "$GITHUB_REPOSITORY"
