[changelog]
body = """
{% for entry in commits | commit_groups(groups=commit_parsers_groups) %}
## {{ entry.group | striptags | trim }}
{% for commit in entry.commits %}- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}
{% endfor %}
{% endfor %}
"""
trim = true
render_always = true

[git]
conventional_commits = true
filter_unconventional = true
filter_commits = true
protect_breaking_commits = true
commit_parsers = [
  { scope = "ci", skip = true },
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^revert", group = "Reverts" },
  { message = "^docs|^test|^refactor|^style|^chore|^ci", skip = true },
]
sort_commits = "oldest"
