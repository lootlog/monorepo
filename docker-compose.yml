services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: "rabbitmq-lootlog"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
    ports:
      - 5672:5672
      - 15672:15672
    volumes:
      - rabbitdata:/var/lib/rabbitmq
      - rabbitlog:/var/log/rabbitmq

  lootlog-users-db:
    image: postgres:17-alpine
    container_name: "lootlog-users-db"
    restart: always
    shm_size: 256mb
    volumes:
      - lootlog-users-db:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${USERS_DB_NAME}
      POSTGRES_USER: ${USERS_DB_USER}
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD}
    ports:
      - "5432:5432"
    deploy:
      resources:
        limits:
          memory: 4096M
        reservations:
          memory: 2048M

  lootlog-db:
    image: postgres:17-alpine
    container_name: "lootlog-db"
    restart: always
    shm_size: 2gb
    volumes:
      - lootlog-db:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${LOOTLOG_DB_NAME}
      POSTGRES_USER: ${LOOTLOG_DB_USER}
      POSTGRES_PASSWORD: ${LOOTLOG_DB_PASSWORD}
    ports:
      - "5433:5432"
    deploy:
      resources:
        limits:
          memory: 4096M
        reservations:
          memory: 2048M

  battle-log-db:
    image: postgres:17-alpine
    container_name: "battle-log-db"
    restart: always
    shm_size: 256mb
    volumes:
      - battle-log-db:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${BATTLE_LOG_DB_NAME}
      POSTGRES_USER: ${BATTLE_LOG_DB_USER}
      POSTGRES_PASSWORD: ${BATTLE_LOG_DB_PASSWORD}
    ports:
      - "5434:5432"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  activity-log-db:
    image: timescale/timescaledb:latest-pg17
    container_name: "activity-log-db"
    restart: always
    shm_size: 512mb
    volumes:
      - activity-log-db:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${ACTIVITY_LOG_DB_NAME}
      POSTGRES_USER: ${ACTIVITY_LOG_DB_USER}
      POSTGRES_PASSWORD: ${ACTIVITY_LOG_DB_PASSWORD}
    ports:
      - "5435:5432"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  meilisearch:
    image: "getmeili/meilisearch:v1.22.2"
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY}
    ports:
      - 7700:7700
    volumes:
      - "meilisearch:/meili_data"
    healthcheck:
      test: set -o pipefail;curl -fsS http://localhost:7700/health | grep -q '{"status":"available"}'
      retries: 3
      timeout: 5s

  redis:
    image: "docker.dragonflydb.io/dragonflydb/dragonfly:v1.34.1"
    container_name: "redis-lootlog"
    ports:
      - "6379:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - "--requirepass=${REDIS_PASSWORD}"
      - "--cluster_mode=emulated"
      - "--lock_on_hashtags"
      - "--dir=/data"
    volumes:
      - "redis:/data"

  traefik:
    image: "traefik:v3.6.10"
    container_name: "traefik"
    # network_mode: "host"
    command:
      #- "--log.level=DEBUG"
      # - "--api.insecure=true"
      # - "--providers.docker=true"
      # - "--providers.docker.exposedbydefault=false"
      # - "--entryPoints.web.address=:80"
      # - "--configFile=/etc/traefik/traefik_dynamic.yml"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./traefik/dev/traefik_dynamic.yml:/etc/traefik/traefik_dynamic.yml:ro"
      - "./traefik/dev/traefik.yml:/etc/traefik/traefik.yml:ro"

volumes:
  rabbitdata:
  rabbitlog:
  lootlog-db:
  lootlog-users-db:
  meilisearch:
  redis:
  battle-log-db:
  activity-log-db:
