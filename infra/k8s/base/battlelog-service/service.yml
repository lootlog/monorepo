apiVersion: v1
kind: Service
metadata:
  name: battlelog-service
  labels:
    app: battlelog-service
    service: battlelog-service
  annotations:
    ingress.kubernetes.io/service-upstream: "true"
spec:
  ports:
    - port: 4000
      targetPort: 4000
      protocol: TCP
      name: http
  selector:
    app: battlelog-service
