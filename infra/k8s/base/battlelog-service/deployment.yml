apiVersion: apps/v1
kind: Deployment
metadata:
  name: battlelog-service
spec:
  selector:
    matchLabels:
      app: battlelog-service
  template:
    metadata:
      labels:
        app: battlelog-service
    spec:
      serviceAccountName: battlelog-service
      containers:
        - name: battlelog-service
          image: kamilwronka7/lootlog-battlelog-service:latest

          resources:
            requests:
              memory: "256Mi"
              cpu: "50m"
            limits:
              memory: "1Gi"
              cpu: "1000m"

          ports:
            - name: container-port
              containerPort: 4000

          env:
            - name: NODE_OPTIONS
              value: "--max-old-space-size=800"

            - name: PORT
              value: "4000"
            - name: ENV
              valueFrom:
                secretKeyRef:
                  key: env
                  name: lootlog-battlelog-service-secrets
            - name: SERVICE_NAME
              value: battlelog-service
            - name: POSTGRESQL_CONNECTION_URI
              valueFrom:
                secretKeyRef:
                  name: lootlog-battlelog-service-secrets
                  key: postgresqlConnectionUri
            - name: AXIOM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lootlog-battlelog-service-secrets
                  key: axiomToken
            - name: AXIOM_DATASET
              valueFrom:
                secretKeyRef:
                  name: lootlog-battlelog-service-secrets
                  key: axiomDataset
            - name: REDIS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: lootlog-battlelog-service-secrets
                  key: redisUsername
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lootlog-battlelog-service-secrets
                  key: redisPassword
            - name: R2_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: lootlog-battlelog-service-secrets
                  key: r2Endpoint
            - name: R2_BUCKET_NAME
              valueFrom:
                secretKeyRef:
                  name: lootlog-battlelog-service-secrets
                  key: r2BucketName
            - name: R2_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: lootlog-battlelog-service-secrets
                  key: r2AccessKeyId
            - name: R2_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: lootlog-battlelog-service-secrets
                  key: r2SecretAccessKey
            - name: R2_REGION
              valueFrom:
                secretKeyRef:
                  name: lootlog-battlelog-service-secrets
                  key: r2Region
            - name: REDIS_HOST
              value: dragonfly
            - name: REDIS_PORT
              value: "6379"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: lootlog-battlelog-service-secrets
                  key: otelExporterOtlpEndpoint
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: lootlog-battlelog-service-secrets
                  key: otelExporterOtlpHeaders
            - name: OTEL_NODE_RESOURCE_DETECTORS
              value: "env,host,os,process"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: SERVICE_NAMESPACE
              valueFrom:
                secretKeyRef:
                  name: lootlog-battlelog-service-secrets
                  key: serviceNamespace

          livenessProbe:
            httpGet:
              path: /healthz
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 5
