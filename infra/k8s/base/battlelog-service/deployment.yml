apiVersion: apps/v1
kind: Deployment
metadata:
  name: battlelog-service
spec:
  selector:
    matchLabels:
      app: battlelog-service
  template:
    metadata:
      labels:
        app: battlelog-service
    spec:
      serviceAccountName: battlelog-service
      containers:
        - name: battlelog-service
          image: kamilwronka7/lootlog-battlelog-service:latest
          resources:
            requests:
              memory: '512Mi'
              cpu: '500m'
            limits:
              memory: '768Mi'
              cpu: '700m'
          ports:
            - name: container-port
              containerPort: 4000
          env:
            - name: PORT
              value: '4000'
            - name: ENV
              valueFrom:
                secretKeyRef:
                  key: env
                  name: lootlog-battlelog-service-secrets
            - name: POSTGRESQL_CONNECTION_URI
              valueFrom:
                secretKeyRef:
                  name: lootlog-battlelog-service-secrets
                  key: postgresqlConnectionUri
            - name: AXIOM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lootlog-battlelog-service-secrets
                  key: axiomToken
            - name: AXIOM_DATASET
              valueFrom:
                secretKeyRef:
                  name: lootlog-battlelog-service-secrets
                  key: axiomDataset
            - name: REDIS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: lootlog-battlelog-service-secrets
                  key: redisUsername
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lootlog-battlelog-service-secrets
                  key: redisPassword
            - name: R2_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: lootlog-battlelog-service-secrets
                  key: r2Endpoint
            - name: R2_BUCKET_NAME
              valueFrom:
                secretKeyRef:
                  name: lootlog-battlelog-service-secrets
                  key: r2BucketName
            - name: R2_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: lootlog-battlelog-service-secrets
                  key: r2AccessKeyId
            - name: R2_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: lootlog-battlelog-service-secrets
                  key: r2SecretAccessKey
            - name: R2_REGION
              valueFrom:
                secretKeyRef:
                  name: lootlog-battlelog-service-secrets
                  key: r2Region
            - name: REDIS_HOST
              value: dragonfly
            - name: REDIS_PORT
              value: '6379'

          livenessProbe:
            httpGet:
              path: /healthz
              port: 4000
          readinessProbe:
            tcpSocket:
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 20
