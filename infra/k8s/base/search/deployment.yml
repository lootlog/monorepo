apiVersion: apps/v1
kind: Deployment
metadata:
  name: search
spec:
  selector:
    matchLabels:
      app: search
  template:
    metadata:
      labels:
        app: search
    spec:
      serviceAccountName: search
      containers:
        - name: search
          image: kamilwronka7/lootlog-search:latest
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          ports:
            - name: container-port
              containerPort: 4000
          env:
            - name: NODE_OPTIONS
              value: "--max-old-space-size=800"
            - name: PORT
              value: "4000"
            - name: ENV
              valueFrom:
                secretKeyRef:
                  key: env
                  name: lootlog-search-secrets
            - name: SERVICE_NAME
              value: search
            - name: RABBITMQ_URI
              valueFrom:
                secretKeyRef:
                  name: lootlog-search-secrets
                  key: rabbitmqUri
            - name: MEILISEARCH_HOST
              valueFrom:
                secretKeyRef:
                  name: lootlog-search-secrets
                  key: meilisearchHost
            - name: MEILISEARCH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lootlog-search-secrets
                  key: meilisearchApiKey
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: lootlog-search-secrets
                  key: otelExporterOtlpEndpoint
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: lootlog-search-secrets
                  key: otelExporterOtlpHeaders
            - name: OTEL_NODE_RESOURCE_DETECTORS
              value: "env,host,os,process"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: SERVICE_NAMESPACE
              valueFrom:
                secretKeyRef:
                  name: lootlog-search-secrets
                  key: serviceNamespace

          livenessProbe:
            httpGet:
              path: /healthz
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 5
