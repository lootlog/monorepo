<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Lootlog.pl</title>
    <script>
      (function () {
        const theme = localStorage.getItem("lootlog-theme") || "default";
        const colorMode = localStorage.getItem("lootlog-color-mode") || "dark";
        const root = document.documentElement;

        root.classList.add(colorMode);
        if (theme === "cat-random") {
          const variants = ["cat-pink", "cat-purple", "cat-blue"];
          root.classList.add(variants[Math.floor(Math.random() * 3)]);
        } else if (theme !== "default") {
          root.classList.add(theme);
        }
      })();
    </script>
  </head>
  <body class="overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
