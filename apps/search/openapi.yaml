openapi: 3.0.0
info:
  title: Search API
  version: "1.0"
  description: Meilisearch-powered search microservice
  contact: {}
paths:
  /healthz:
    get:
      tags:
        - health
      operationId: HealthzController_healthCheck
      parameters: []
      responses:
        "200":
          description: Search service is healthy
        "401":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
        "403":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
        "429":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
      description: Check the health status of the search service
      summary: Health check
  /players:
    get:
      tags:
        - Players
      operationId: PlayersController_getPlayers
      parameters:
        - name: limit
          in: query
          schema:
            type: number
            default: 10
          required: false
        - name: search
          in: query
          schema:
            anyOf:
              - type: string
              - type: array
                items:
                  type: string
          required: false
        - name: world
          in: query
          schema:
            type: string
          required: false
      responses:
        "200":
          description: List of matching players
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayerHitDto_Output"
        "401":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
        "403":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
        "429":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
        "503":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchUnavailableEncoded"
      summary: Search players by name
  /npcs:
    get:
      tags:
        - NPCs
      operationId: NpcsController_getNpcs
      parameters:
        - name: ids
          in: query
          schema:
            type: array
            items:
              type: integer
              minimum: -9007199254740991
              maximum: 9007199254740991
          required: false
        - name: limit
          in: query
          schema:
            type: number
            default: 10
          required: false
        - name: search
          in: query
          schema:
            anyOf:
              - type: string
              - type: array
                items:
                  type: string
          required: false
      responses:
        "200":
          description: List of matching NPCs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NpcHitDto_Output"
        "401":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
        "403":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
        "429":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
        "503":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchUnavailableEncoded"
      summary: Search NPCs by name
  /items:
    get:
      tags:
        - Items
      operationId: ItemsController_getItems
      parameters:
        - name: limit
          in: query
          schema:
            type: number
            default: 20
          required: false
        - name: offset
          in: query
          schema:
            type: number
            default: 0
          required: false
        - name: search
          in: query
          schema:
            type: string
          required: false
        - name: filter
          in: query
          schema:
            anyOf:
              - type: string
              - type: array
                items:
                  type: string
          required: false
          style: form
          explode: true
        - name: facets
          in: query
          schema:
            type: array
            items:
              type: string
          required: false
          style: form
          explode: true
        - name: sort
          in: query
          schema:
            type: array
            items:
              type: string
          required: false
          style: form
          explode: true
      responses:
        "200":
          description: Item search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchItemsResponseDto_Output"
        "401":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
        "403":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
        "429":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
        "503":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchUnavailableEncoded"
      summary: Search items with filters, sorting, and facets
  /all:
    get:
      tags:
        - All
      operationId: AllController_searchAll
      parameters:
        - name: limit
          in: query
          schema:
            type: number
            default: 10
          required: false
        - name: search
          in: query
          schema:
            type: string
          required: false
        - name: world
          in: query
          schema:
            type: string
          required: false
          description: Filters players by world. NPC and item results cover every world of their edition.
      responses:
        "200":
          description: Aggregated search results across items, players, and NPCs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchAllResponseDto_Output"
        "401":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
        "403":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
        "429":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
        "503":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchUnavailableEncoded"
      summary: Search across all categories
  /public/catalog/items:
    get:
      tags:
        - Catalog
      operationId: CatalogController_getItems
      parameters:
        - name: search
          in: query
          schema:
            type: string
          required: false
        - name: gameVersion
          in: query
          schema:
            type: string
            enum:
              - en
              - pl
            description: Only entries of this game edition.
          required: false
        - name: ids
          in: query
          schema:
            type: array
            items:
              type: integer
              minimum: -9007199254740991
              maximum: 9007199254740991
          required: false
          style: form
          explode: true
        - name: rarities
          in: query
          schema:
            type: array
            items:
              type: string
          required: false
          style: form
          explode: true
        - name: types
          in: query
          schema:
            type: array
            items:
              type: string
          required: false
          style: form
          explode: true
        - name: professions
          in: query
          schema:
            type: array
            items:
              type: string
          required: false
          style: form
          explode: true
        - name: minLevel
          in: query
          schema:
            type: number
          required: false
        - name: maxLevel
          in: query
          schema:
            type: number
          required: false
        - name: statKeys
          in: query
          schema:
            type: array
            items:
              type: string
          required: false
          style: form
          explode: true
        - name: excludedStatKeys
          in: query
          schema:
            type: array
            items:
              type: string
          required: false
          style: form
          explode: true
        - name: legendaryBonuses
          in: query
          schema:
            type: array
            items:
              type: string
          required: false
          style: form
          explode: true
        - name: dropSourceTypes
          in: query
          schema:
            type: array
            items:
              type: string
          required: false
          style: form
          explode: true
        - name: event
          in: query
          schema:
            type: string
            description: "Items of the event with this slug: its name and year, such as `wakacje-2026`."
          required: false
        - name: droppedBy
          in: query
          schema:
            type: string
            description: Items that drop from the NPC with this catalog key.
          required: false
        - name: availableSince
          in: query
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: "Items a character on a world opened on this day (`YYYY-MM-DD`) can get: every item of no event, and event items of an edition that ended after it. Events end in the morning and worlds open later in the day, so an edition ending on the opening day is left out. An event without a year comes back, so its items stay."
          required: false
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - relevance
              - id:desc
              - lvl:asc
              - lvl:desc
              - name:asc
              - name:desc
              - attackSpeed:desc
              - upgradedAttackSpeed:desc
            description: "`id:desc` lists the items Margonem added most recently first. `attackSpeed:desc` lists first the items that add the most attack speed to a character with at least 100 agility: their own attack speed plus 0.002 for each point of agility or all attributes. `upgradedAttackSpeed:desc` ranks the same attack speed with each item upgraded to +5 and given the +5 bonus that adds the most of it: attack speed on weapons, agility or all attributes on other pieces."
          required: false
        - name: limit
          in: query
          schema:
            type: number
            default: 24
          required: false
        - name: offset
          in: query
          schema:
            type: number
            default: 0
          required: false
      responses:
        "200":
          description: Public catalog items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogItemsResponseDto_Output"
        "401":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
        "403":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
        "429":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
        "503":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchUnavailableEncoded"
      summary: List items in the public catalog
  /public/catalog/npcs:
    get:
      tags:
        - Catalog
      operationId: CatalogController_getNpcs
      parameters:
        - name: search
          in: query
          schema:
            type: string
          required: false
        - name: gameVersion
          in: query
          schema:
            type: string
            enum:
              - en
              - pl
            description: Only entries of this game edition.
          required: false
        - name: ids
          in: query
          schema:
            type: array
            items:
              type: integer
              minimum: -9007199254740991
              maximum: 9007199254740991
          required: false
          style: form
          explode: true
        - name: keys
          in: query
          schema:
            type: array
            items:
              type: string
          required: false
          style: form
          explode: true
        - name: types
          in: query
          schema:
            type: array
            items:
              type: string
          required: false
          style: form
          explode: true
        - name: limit
          in: query
          schema:
            type: number
            default: 24
          required: false
        - name: offset
          in: query
          schema:
            type: number
            default: 0
          required: false
      responses:
        "200":
          description: Public catalog NPCs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogNpcsResponseDto_Output"
        "401":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
        "403":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
        "429":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
        "503":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchUnavailableEncoded"
      summary: List NPCs in the public catalog
  /public/catalog/events:
    get:
      tags:
        - Catalog
      operationId: CatalogController_getEvents
      parameters:
        - name: gameVersion
          in: query
          schema:
            type: string
            enum:
              - en
              - pl
            description: Only entries of this game edition.
          required: false
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogEventsResponseDto_Output"
        "401":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
        "403":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
        "429":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
        "503":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchUnavailableEncoded"
      summary: List events in the public catalog
  /public/catalog/index:
    get:
      tags:
        - Catalog
      operationId: CatalogController_getIndex
      parameters:
        - name: gameVersion
          in: query
          schema:
            type: string
            enum:
              - en
              - pl
            description: Only entries of this game edition.
          required: false
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogIndexResponseDto_Output"
        "401":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
        "403":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
        "429":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
        "503":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchUnavailableEncoded"
      summary: List every item and NPC in the public catalog
components:
  schemas:
    SearchUnavailableEncoded:
      type: object
      properties:
        _tag:
          type: string
          enum:
            - SearchUnavailable
        message:
          type: string
      required:
        - _tag
        - message
    CatalogIndexResponseDto_Output:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CatalogIndexEntryDto_Output"
          description: Every item, by id.
        npcs:
          type: array
          items:
            $ref: "#/components/schemas/CatalogIndexEntryDto_Output"
          description: Every NPC as it is now, once per monster, as `CatalogControllerGetNpcs` lists it; by id.
      required:
        - items
        - npcs
      description: Every item and NPC of the public catalog, unlike its searches, which stop at 1000 hits
    CatalogIndexEntryDto_Output:
      type: object
      properties:
        id:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        name:
          type: string
      required:
        - id
        - name
      description: A catalog entry by the id and name its links carry, such as `/items/41392-odzienie-dominujacego-czaru` on the wiki.
    CatalogEventsResponseDto_Output:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/CatalogEventDto_Output"
          description: The latest year first, then by name.
      required:
        - events
      description: Public catalog events
    CatalogEventDto_Output:
      type: object
      properties:
        slug:
          type: string
          description: The event's slug, its name and year, such as `halloween-2026`; `CatalogControllerGetItemsQuery.event` lists its items.
        name:
          type: string
          description: The event as the game writes it, such as `Halloween 2026 r.`.
        year:
          description: The year its name gives; none for an event without one.
          nullable: true
          type: number
        itemCount:
          type: number
          description: How many catalog items belong to the event.
        boss:
          description: The strongest monster its highest-level item drops from, which pictures the event; none when Lootlog has not seen that item drop.
          nullable: true
          type: object
          properties:
            name:
              type: string
            icon:
              nullable: true
              type: string
          required:
            - name
            - icon
          additionalProperties: false
      required:
        - slug
        - name
        - year
        - itemCount
        - boss
      description: A Margonem event whose items are in the public catalog
    CatalogNpcsResponseDto_Output:
      type: object
      properties:
        hits:
          type: array
          items:
            $ref: "#/components/schemas/CatalogNpcDto_Output"
        estimatedTotalHits:
          type: number
      required:
        - hits
        - estimatedTotalHits
      description: Public catalog NPCs
    CatalogNpcDto_Output:
      type: object
      properties:
        key:
          type: string
          description: Stable catalog key of the NPC, used to link its page.
        id:
          type: number
        name:
          type: string
        icon:
          type: string
        lvl:
          type: number
        type:
          type: string
          enum:
            - COMMON
            - ELITE
            - ELITE2
            - ELITE3
            - HERO
            - EVENT_HERO
            - COLOSSUS
            - TITAN
            - HERO_TRACKER
            - NPC
        gameVersion:
          type: string
          enum:
            - en
            - pl
        locations:
          type: array
          items:
            type: object
            properties:
              map:
                type: string
                description: The map's name.
              share:
                type: number
                description: The share of the NPC's latest recorded fights on the map, from 0 to 1, rounded to a hundredth.
            required:
              - map
              - share
          description: Maps the NPC is fought on, most fought first, from its latest 1000 recorded fights; maps under 1% of them are left out. Lootlog recomputes them daily, so an NPC first seen today may have none yet.
        formerLevels:
          type: array
          items:
            type: object
            properties:
              lvl:
                type: number
                description: The level it had.
              until:
                type: string
                description: The UTC day, as `YYYY-MM-DD`, its next level was first recorded.
            required:
              - lvl
              - until
          description: Levels the NPC had before the game changed it, oldest first. Lootlog recomputes them daily from recorded fights and leaves out NPCs whose level follows the player's.
      required:
        - key
        - id
        - name
        - icon
        - lvl
        - type
        - gameVersion
        - locations
        - formerLevels
      description: A Margonem NPC in the public catalog
    CatalogItemsResponseDto_Output:
      type: object
      properties:
        hits:
          type: array
          items:
            $ref: "#/components/schemas/CatalogItemDto_Output"
        estimatedTotalHits:
          type: number
      required:
        - hits
        - estimatedTotalHits
      description: Public catalog items
    CatalogItemDto_Output:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        icon:
          type: string
        stat:
          type: string
        lvl:
          type: number
        rarity:
          nullable: true
          type: string
        type:
          nullable: true
          type: string
        droppedBy:
          type: array
          items:
            $ref: "#/components/schemas/CatalogDropSourceDto_Output"
        elasticLevel:
          type: boolean
          description: Whether the item takes the level of the character who loots it, so `lvl` and `stat` describe one of its levels.
      required:
        - id
        - name
        - icon
        - stat
        - lvl
        - rarity
        - type
        - droppedBy
        - elasticLevel
      description: A Margonem item in the public catalog
    CatalogDropSourceDto_Output:
      type: object
      properties:
        key:
          type: string
          description: The NPC's catalog key, as `CatalogNpcDto_Output.key`.
        id:
          type: number
        name:
          type: string
        lvl:
          nullable: true
          type: number
        icon:
          nullable: true
          type: string
        type:
          nullable: true
          type: string
        retired:
          type: boolean
          description: "Whether the NPC no longer drops the item: Lootlog has recorded its loot far too often since the item's last drop for the gap to be chance."
      required:
        - key
        - id
        - name
        - lvl
        - icon
        - type
        - retired
      description: An NPC an item drops from
    SearchAllResponseDto_Output:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type: number
              name:
                type: string
              icon:
                type: string
              stat:
                type: string
                default: ""
              lvl:
                type: number
              rarity:
                nullable: true
                type: string
              type:
                nullable: true
                type: string
              worlds:
                type: array
                items:
                  type: string
                default: &a1 []
            required:
              - id
              - name
              - icon
              - stat
              - lvl
              - rarity
              - type
              - worlds
            description: Item search hit
        players:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              lvl:
                type: number
              prof:
                type: string
              icon:
                type: string
              characterId:
                type: number
              accountId:
                type: number
              world:
                type: string
            required:
              - id
              - name
              - lvl
              - prof
              - icon
              - characterId
              - accountId
              - world
            description: Player search hit
        npcs:
          type: array
          items:
            type: object
            properties:
              id:
                type: number
              identityNamespace:
                type: string
                enum:
                  - legacy
                  - runtime
                  - template
                description: "Meaning of `id`: a Margonem template id, a runtime spawn id observed without a template, or an overloaded legacy id."
              prof:
                type: string
              icon:
                type: string
              name:
                type: string
              lvl:
                type: number
              wt:
                type: number
              type:
                type: string
                enum:
                  - COMMON
                  - ELITE
                  - ELITE2
                  - ELITE3
                  - HERO
                  - EVENT_HERO
                  - COLOSSUS
                  - TITAN
                  - HERO_TRACKER
                  - NPC
              margonemType:
                type: number
              worlds:
                type: array
                items:
                  type: string
                description: Worlds of the edition where this NPC was observed.
                default: &a2 []
              gameVersion:
                type: string
                enum:
                  - en
                  - pl
