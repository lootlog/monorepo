openapi: 3.0.0
info:
  title: Search API
  version: "1.0"
  description: Player search
  contact: {}
paths:
  /healthz:
    get:
      tags:
        - health
      operationId: HealthzController_healthCheck
      parameters: []
      responses:
        "200":
          description: Search service is healthy
        "401":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
        "403":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
        "429":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
      description: Check the health status of the search service
      summary: Health check
  /players:
    get:
      tags:
        - Players
      operationId: PlayersController_getPlayers
      parameters:
        - name: limit
          in: query
          schema:
            type: number
            default: 10
          required: false
        - name: search
          in: query
          schema:
            anyOf:
              - type: string
              - type: array
                items:
                  type: string
          required: false
        - name: world
          in: query
          schema:
            type: string
          required: false
      responses:
        "200":
          description: List of matching players
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayerHitDto_Output"
        "401":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
        "403":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
        "429":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
        "503":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchUnavailableEncoded"
      summary: Search players by name
components:
  schemas:
    SearchUnavailableEncoded:
      type: object
      properties:
        _tag:
          type: string
          enum:
            - SearchUnavailable
        message:
          type: string
      required:
        - _tag
        - message
    PlayerHitDto_Output:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        lvl:
          type: number
        prof:
          type: string
        icon:
          type: string
        characterId:
          type: number
        accountId:
          type: number
        world:
          type: string
      required:
        - id
        - name
        - lvl
        - prof
        - icon
        - characterId
        - accountId
        - world
      description: Player search hit
tags: []
servers: []
