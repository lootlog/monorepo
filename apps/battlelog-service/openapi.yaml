        - name: cursor
          required: false
          in: query
          schema:
            type: string
        - name: size
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 100
            default: 20
            type: number
        - name: sortOrder
          required: false
          in: query
          schema:
            default: desc
            type: string
            enum:
              - asc
              - desc
        - name: includeTotal
          required: false
          in: query
          schema:
            type: boolean
        - name: world
          required: false
          in: query
          schema:
            type: string
        - name: type
          required: false
          in: query
          schema:
            type: array
            items:
              type: string
              enum:
                - solo
                - group
