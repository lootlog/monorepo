                      },
                  },
                  {
                    "name": "sortOrder",
                    "required": false,
                    "in": "query",
                    "schema":
                      {
                        "default": "desc",
                        "type": "string",
                        "enum": ["asc", "desc"],
                      },
                  },
                  {
                    "name": "includeTotal",
                    "required": false,
                    "in": "query",
                    "schema": { "type": "boolean" },
                  },
                  {
