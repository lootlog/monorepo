    BattleRawResponseDto_Output:
      type: object
      properties:
        battleId:
          type: string
        timestamp:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        rawData:
          type: object
          properties:
            accountId:
              type: string
            characterId:
              type: string
            world:
              type: string
            events:
              type: array
              items:
                type: object
                properties:
                  attackerId:
                    type: string
                    nullable: true
                  defenderId:
                    type: string
                    nullable: true
                  attackerHpPercentage:
                    type: number
                    nullable: true
                  defenderHpPercentage:
                    type: number
                    nullable: true
                  actions:
                    type: array
                    items:
                      type: object
                      properties:
                        actionType:
                          type: string
                        param:
                          type: string
                      required:
                        - actionType
                        - param
                required:
                  - attackerId
                  - defenderId
                  - attackerHpPercentage
                  - defenderHpPercentage
                  - actions
            sourceEvents:
              type: array
              items: {}
          required:
            - accountId
            - characterId
            - world
            - events
      required:
        - battleId
        - timestamp
        - rawData
    UpdateBattleDto:
      type: object
      properties:
        public:
          type: boolean
      required:
        - public
    BattleDeletedResponseDto_Output:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    DeleteUserDataDto:
      type: object
      properties:
        userId:
          type: string
      required:
        - userId
    BattleAcceptedResponseDto_Output:
      type: object
      properties:
        status:
          type: string
          enum:
            - ACCEPTED
      required:
        - status
