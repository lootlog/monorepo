                      { "type": "array", "items": { "type": "string" } },
                  },
                  {
                    "name": "search",
                    "required": false,
                    "in": "query",
                    "schema": { "type": "string" },
                  },
                  {
                    "name": "result",
                    "required": false,
                    "in": "query",
                    "schema":
                      {
                        "type": "array",
                        "items":
                          { "type": "string", "enum": ["won", "lost", "flee"] },
                      },
                  },
                  {
                    "name": "ph",
                    "required": false,
                    "in": "query",
                    "schema": { "type": "boolean" },
                  },
                  {
                    "name": "matchmaking",
                    "required": false,
                    "in": "query",
                    "schema": { "type": "boolean" },
                  },
                  {
                    "name": "minLevel",
                    "required": false,
                    "in": "query",
