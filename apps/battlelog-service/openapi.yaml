    get:
      description: Check the health status of the API
      operationId: HealthzController_healthCheck
      parameters: []
      responses:
        "200":
          description: API is healthy
      summary: Health check
      tags:
        - health
  /battles:
    post:
      operationId: BattlesController_createBattle
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBattleDto"
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BattleCreatedResponseDto_Output"
      security:
        - bearer: []
      summary: Create a battle
      tags:
        - battles
  /battles/@me:
