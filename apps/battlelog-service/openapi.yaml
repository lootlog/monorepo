info:
  title: Battle Log API
  description: The Battle Log API documentation
  version: "1.0"
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    CreateBattleDto:
      type: object
      properties:
        accountId:
          type: string
        characterId:
          type: string
        submissionId:
          type: string
          minLength: 1
          maxLength: 128
        world:
          type: string
        matchmaking:
          type: boolean
        events:
          minItems: 1
          type: array
          items:
            type: object
            properties:
              party:
                type: object
                properties:
                  members:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        id:
                          type: number
                        account:
                          type: number
                        nick:
                          type: string
                        icon:
                          type: string
                        commander:
                          type: number
                      required:
                        - id
                        - account
                        - nick
                        - icon
                required:
                  - members
              f:
                type: object
                properties:
                  m:
                    type: array
                    items:
                      type: string
                  endBattle:
                    type: number
                  init:
                    type: string
                  auto:
                    type: string
                  w:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        originalId:
                          type: number
                        name:
                          type: string
                        lvl:
                          type: number
                        prof:
                          type: string
                        icon:
                          type: string
                        team:
                          type: number
                      required:
                        - originalId
                        - name
                        - lvl
                        - prof
                        - icon
                        - team
              ev:
                type: number
              match_summary:
                type: object
                properties:
                  difficulty_rank:
                    type: number
                  result:
                    type: number
                  rating_delta:
                    type: number
                  opponent_lvl:
                    type: number
                  opponent_oplvl:
                    type: number
                  opponent_rating:
                    type: number
                  rating:
                    type: number
                  status:
                    type: number
                  placement_cur:
                    type: number
                  placement_max:
                    type: number
                  points_gained:
                    type: number
                  daily_stage:
                    type: object
                    properties:
                      id:
                        type: number
                      points_cur:
                        type: number
                      points_max:
                        type: number
                      points_step:
                        type: number
                      rewards_last:
                        type: number
                      rewards_cur:
                        type: number
                      rewards_max:
                        type: number
                    required:
                      - id
                      - points_cur
                      - points_max
                      - points_step
                      - rewards_last
                      - rewards_cur
                      - rewards_max
                required:
                  - difficulty_rank
                  - result
                  - rating_delta
                  - opponent_lvl
                  - opponent_oplvl
                  - opponent_rating
                  - rating
                  - status
            required:
              - f
              - ev
