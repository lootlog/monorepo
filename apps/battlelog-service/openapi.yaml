                    "required": false,
                    "in": "query",
                    "schema": { "type": "string" },
                  },
                  {
                    "name": "type",
                    "required": false,
                    "in": "query",
                    "schema":
                      {
                        "type": "array",
                        "items":
                          { "type": "string", "enum": ["solo", "group"] },
                      },
                  },
                  {
