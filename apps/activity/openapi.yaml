openapi: 3.0.0
info:
  title: Activity Logger API
  version: "1.0"
  description: The Activity Logger API documentation
  contact: {}
paths:
  /healthz:
    get:
      tags:
        - health
      operationId: HealthzController_check
      parameters: []
      responses:
        "200":
          description: |-
            Service is healthy

            The Health Check is successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  info:
                    example:
                      database:
                        status: up
                    nullable: true
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        status:
                          type: string
                      required:
                        - status
                  error:
                    example: {}
                    nullable: true
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        status:
                          type: string
                      required:
                        - status
                  details:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        status:
                          type: string
                      required:
                        - status
                    example:
                      database:
                        status: up
        "503":
          description: |-
            Service is unhealthy

            The Health Check is not successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  info:
                    example:
                      database:
                        status: up
                    nullable: true
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        status:
                          type: string
                      required:
                        - status
                  error:
                    example:
                      redis:
                        status: down
                        message: Could not connect
                    nullable: true
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        status:
                          type: string
                      required:
                        - status
                  details:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        status:
                          type: string
                      required:
                        - status
                    example:
                      database:
                        status: up
                      redis:
                        status: down
                        message: Could not connect
      description: Check the health status of the Activity service (database, API service, memory, disk)
      summary: Health check
  /guilds/{guildId}/activity-logs:
    get:
      tags:
        - guilds
      operationId: ActivitiesController_findByGuild
      parameters:
        - name: guildId
          in: path
          schema:
            type: string
          required: true
        - name: type
          in: query
          schema:
            type: array
            items:
              type: string
              enum:
                - CONNECT_EVENT
                - DISCONNECT_EVENT
          required: false
        - name: source
          in: query
          schema:
            type: array
            items:
              type: string
              enum:
                - GAME
                - WEB_APP
          required: false
        - name: playerName
          in: query
          schema:
            type: string
          required: false
        - name: clanName
          in: query
          schema:
            type: string
          required: false
        - name: world
          in: query
          schema:
            type: string
          required: false
        - name: startDate
          in: query
          schema:
            type: string
            format: date-time
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
          required: false
        - name: endDate
          in: query
          schema:
            type: string
            format: date-time
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
          required: false
        - name: cursor
          in: query
          schema:
            type: string
          required: false
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          required: false
      security:
        - bearer: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedActivitiesResponseDto"
      summary: Get activities for a specific guild
  /guilds/{guildId}/activity-logs/actor-name-suggestions:
    get:
      tags:
        - guilds
      operationId: ActivitiesController_suggestActorNames
      parameters:
        - name: guildId
          in: path
          schema:
            type: string
          required: true
        - name: search
          in: query
          schema:
            type: string
            maxLength: 50
          required: false
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
          required: false
      security:
        - bearer: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActorNameSuggestionsResponseDto_Output"
      summary: Get actor name suggestions for a guild
  /guilds/{guildId}/activity-logs/world-suggestions:
    get:
      tags:
        - guilds
      operationId: ActivitiesController_suggestWorlds
      parameters:
        - name: guildId
          in: path
          schema:
            type: string
          required: true
        - name: search
          in: query
          schema:
            type: string
            maxLength: 50
          required: false
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
          required: false
      security:
        - bearer: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorldSuggestionsResponseDto_Output"
      summary: Get world suggestions for a guild
  /guilds/{guildId}/activity-logs/clan-name-suggestions:
    get:
      tags:
        - guilds
      operationId: ActivitiesController_suggestClanNames
      parameters:
        - name: guildId
          in: path
          schema:
            type: string
          required: true
        - name: search
          in: query
          schema:
            type: string
            maxLength: 50
          required: false
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
          required: false
      security:
        - bearer: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClanNameSuggestionsResponseDto_Output"
      summary: Get clan name suggestions for a guild
  /guilds/{guildId}/users/{userId}/activity-logs:
    get:
      tags:
        - guilds
      operationId: ActivitiesController_findByUser
      parameters:
        - name: guildId
          in: path
          schema:
            type: string
          required: true
        - name: userId
          in: path
          schema:
            type: string
          required: true
        - name: type
          in: query
          schema:
            type: array
            items:
              type: string
              enum:
                - CONNECT_EVENT
                - DISCONNECT_EVENT
          required: false
        - name: source
          in: query
          schema:
            type: array
            items:
              type: string
              enum:
                - GAME
                - WEB_APP
          required: false
        - name: playerName
          in: query
          schema:
            type: string
          required: false
        - name: clanName
          in: query
          schema:
            type: string
          required: false
        - name: world
          in: query
          schema:
            type: string
          required: false
        - name: startDate
          in: query
          schema:
            type: string
            format: date-time
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
          required: false
        - name: endDate
          in: query
          schema:
            type: string
            format: date-time
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
          required: false
        - name: cursor
          in: query
          schema:
            type: string
          required: false
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          required: false
      security:
        - bearer: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedActivitiesResponseDto"
      summary: Get activities for a specific user in a guild
  /guilds/{guildId}/member-activity-stats:
    get:
      tags:
        - guilds
      operationId: ActivitiesController_getMemberActivityStats
      parameters:
        - name: guildId
          in: path
          schema:
            type: string
          required: true
      security:
        - bearer: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MemberActivityStatsResponseDto"
      summary: Get activity stats for guild members by source
  /guilds/{guildId}/activity-logs/{id}:
    get:
      tags:
        - guilds
      operationId: ActivitiesController_findOne
      parameters:
        - name: guildId
          in: path
          schema:
            type: string
          required: true
        - name: id
          in: path
          schema:
            type: string
          required: true
      security:
        - bearer: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityResponseDto"
        "404":
          description: Activity not found
      summary: Get a single activity by ID
    delete:
      tags:
        - guilds
      operationId: ActivitiesController_deleteActivity
      parameters:
        - name: guildId
          in: path
          schema:
            type: string
          required: true
        - name: id
          in: path
          schema:
            type: string
          required: true
      security:
        - bearer: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteActivityResponseDto_Output"
        "404":
          description: Activity not found
      summary: Delete a specific activity by ID
components:
  schemas:
    PaginatedActivitiesResponseDto:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              userId:
                type: string
              guildId:
                type: string
              discordId:
                type: string
              type:
                type: string
                enum:
                  - CONNECT_EVENT
                  - DISCONNECT_EVENT
              source:
                type: string
                enum:
                  - GAME
                  - WEB_APP
              createdAt:
                type: string
                format: date-time
                pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
              world:
                nullable: true
                type: string
              details:
                type: object
                additionalProperties: {}
              actorSnapshot:
                type: object
                properties:
                  id:
                    type: string
                  accountId:
                    type: number
                  characterId:
                    type: number
                  name:
                    type: string
                  clanName:
                    nullable: true
                    type: string
                  clanId:
                    nullable: true
                    type: number
                  icon:
                    type: string
                  lvl:
                    type: number
                  prof:
                    type: string
                  source:
                    type: string
                    enum:
                      - GAME
                      - WEB_APP
                  createdAt:
                    type: string
                    format: date-time
                    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                required:
                  - id
                  - accountId
                  - characterId
                  - name
                  - icon
                  - lvl
                  - prof
                  - source
                  - createdAt
            required:
              - id
              - userId
              - guildId
              - discordId
              - type
              - source
              - createdAt
        nextCursor:
          type: string
        hasMore:
          type: boolean
      required:
        - data
        - hasMore
    ActorNameSuggestionsResponseDto_Output:
      type: object
      properties:
        suggestions:
          type: array
          items:
            type: string
      required:
        - suggestions
    WorldSuggestionsResponseDto_Output:
      type: object
      properties:
        worlds:
          type: array
          items:
            type: string
      required:
        - worlds
    ClanNameSuggestionsResponseDto_Output:
      type: object
      properties:
        suggestions:
          type: array
          items:
            type: string
      required:
        - suggestions
    MemberActivityStatsResponseDto:
      type: object
      properties:
        guildId:
          type: string
        discordId:
          type: string
        source:
          type: string
          enum:
            - GAME
            - WEB_APP
        lastSeenAt:
          format: date-time
          nullable: true
          type: string
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        visitCount:
          type: number
        activeSessionCount:
          type: number
        createdAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        updatedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
      required:
        - guildId
        - discordId
        - source
        - visitCount
        - activeSessionCount
        - createdAt
        - updatedAt
    ActivityResponseDto:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        guildId:
          type: string
        discordId:
          type: string
        type:
          type: string
          enum:
            - CONNECT_EVENT
            - DISCONNECT_EVENT
        source:
          type: string
          enum:
            - GAME
            - WEB_APP
        createdAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        world:
          nullable: true
          type: string
        details:
          type: object
          additionalProperties: {}
        actorSnapshot:
          type: object
          properties:
            id:
              type: string
            accountId:
              type: number
            characterId:
              type: number
            name:
              type: string
            clanName:
              nullable: true
              type: string
            clanId:
              nullable: true
              type: number
            icon:
              type: string
            lvl:
              type: number
            prof:
              type: string
            source:
              type: string
              enum:
                - GAME
                - WEB_APP
            createdAt:
              type: string
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
          required:
            - id
            - accountId
            - characterId
            - name
            - icon
            - lvl
            - prof
            - source
            - createdAt
      required:
        - id
        - userId
        - guildId
        - discordId
        - type
        - source
        - createdAt
    DeleteActivityResponseDto_Output:
      type: object
      properties:
        count:
          type: number
      required:
        - count
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags: []
servers: []
