openapi: 3.0.0
paths:
  /users/@me:
    delete:
      description: Permanently delete user account and associated data
      operationId: UsersController_deleteAccount
      parameters: []
      responses:
        "200":
          description: Account deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOkResponseDto_Output"
        "503":
          description: Account deletion is temporarily unavailable
      security:
        - bearer: []
      summary: Delete user account
      tags:
        - users
  /users/@me/preferences:
    get:
      description: Retrieve user preferences
      operationId: UsersController_getUserPreferences
      parameters: []
      responses:
        "200":
          description: User preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferencesResponseDto_Output"
      security:
        - bearer: []
      summary: Get user preferences
      tags:
        - users
    patch:
      description: Update user preferences
      operationId: UsersController_updateUserPreferences
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserPreferencesDto"
      responses:
        "200":
          description: Updated user preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferencesResponseDto_Output"
      security:
        - bearer: []
      summary: Update user preferences
      tags:
        - users
  /users/@me/guilds:
    get:
      description: Retrieve the authenticated user's Discord guilds that also exist in Lootlog, together with Lootlog access status
      operationId: UsersController_getCurrentUserGuilds
      parameters: []
      responses:
        "200":
          description: Current user guilds with Lootlog access metadata
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserCurrentGuildResponseDto_Output"
      security:
        - bearer: []
      summary: Get current user guilds
      tags:
        - users
  /users/@me/guilds/accessible:
    get:
      description: Retrieve the authenticated user's Lootlog guilds where cached member data indicates access
      operationId: UsersController_getCurrentUserAccessibleGuilds
      parameters: []
      responses:
        "200":
          description: Accessible current user guilds with Lootlog access metadata
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserCurrentGuildResponseDto_Output"
      security:
        - bearer: []
      summary: Get accessible current user guilds
      tags:
        - users
  /users/@me/game-preferences/accounts/{accountId}:
    get:
      description: Retrieve account-scoped game preferences for a specific Margonem account
      operationId: UsersController_getUserGameAccountPreferences
      parameters:
        - name: accountId
          required: true
          in: path
          description: Margonem account ID
          schema:
            example: "1234567"
            type: string
      responses:
        "200":
          description: User game account preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserGameAccountPreferencesResponseDto_Output"
      security:
        - bearer: []
      summary: Get user game account preferences
      tags:
        - users
    patch:
      description: Update account-scoped game preferences for a specific Margonem account
      operationId: UsersController_updateUserGameAccountPreferences
      parameters:
        - name: accountId
          required: true
          in: path
          description: Margonem account ID
          schema:
            example: "1234567"
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserGameAccountPreferencesDto"
      responses:
        "200":
          description: Updated user game account preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserGameAccountPreferencesResponseDto_Output"
      security:
        - bearer: []
      summary: Update user game account preferences
      tags:
        - users
  /guilds/{guildId}/members/@me:
    get:
      description: Retrieve the authenticated user's member information for this guild
      operationId: MembersController_getMe
      parameters:
        - name: guildId
          required: true
          in: path
          description: Guild ID
          schema:
            example: guild_123
            type: string
      responses:
        "200":
          description: Current member information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NullableMemberResponseDto"
        "404":
          description: Member not found
      security:
        - bearer: []
      summary: Get current member
      tags:
        - members
  /guilds/{guildId}/members/@me/refresh:
    post:
      description: Refresh the authenticated user's member information from Discord
      operationId: MembersController_refreshMe
      parameters:
        - name: guildId
          required: true
          in: path
          description: Guild ID
          schema:
            example: guild_123
            type: string
      responses:
        "200":
          description: Refreshed member information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NullableMemberResponseDto"
      security:
        - bearer: []
      summary: Refresh current member
      tags:
        - members
  /guilds/{guildId}/members/{discordId}/refresh:
    post:
      description: Refresh a specific member's information from Discord (admin only)
      operationId: MembersController_refreshMember
      parameters:
        - name: discordId
          required: true
          in: path
          description: Discord user ID
          schema:
            example: user_123
            type: string
        - name: guildId
          required: true
          in: path
          description: Guild ID
          schema:
            example: guild_123
      responses:
        "200":
          description: Member refreshed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberResponseDto"
        "403":
          description: Forbidden - admin permission required
        "404":
          description: Member not found
      security:
        - bearer: []
      summary: Refresh specific member
      tags:
        - members
  /guilds/{guildId}/members/{discordId}/deactivate:
    patch:
      description: Deactivate a specific member (admin only)
      operationId: MembersController_deactivateMember
      parameters:
        - name: discordId
          required: true
          in: path
          description: Discord user ID
          schema:
            example: user_123
            type: string
        - name: guildId
          required: true
          in: path
          description: Guild ID
          schema:
            example: guild_123
      responses:
        "200":
          description: Member deactivated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberResponseDto"
        "403":
          description: Forbidden - admin permission required
        "404":
          description: Member not found
      security:
        - bearer: []
      summary: Deactivate member
      tags:
        - members
  /guilds/{guildId}/members/{discordId}/lootlog-config-summary:
    get:
      description: Retrieve guild-scoped lootlog configuration summary for a specific member (admin only)
      operationId: MembersController_getMemberLootlogConfigSummary
      parameters:
        - name: discordId
          required: true
          in: path
          description: Discord user ID
          schema:
            example: user_123
            type: string
        - name: guildId
          required: true
          in: path
          description: Guild ID
          schema:
            example: guild_123
      responses:
        "200":
          description: Member lootlog configuration summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberLootlogConfigSummaryResponseDto_Output"
        "403":
          description: Forbidden - admin permission required
        "404":
          description: Member not found
      security:
        - bearer: []
      summary: Get member lootlog config summary
      tags:
        - members
  /guilds/{guildId}/members:
    get:
      description: Retrieve all members for a guild
      operationId: MembersController_getGuildMembers
      parameters:
        - name: includeInactive
          required: false
          in: query
          description: Include inactive members
          schema:
            type: boolean
        - name: guildId
          required: true
          in: path
          description: Guild ID
          schema:
            example: guild_123
      responses:
        "200":
          description: List of guild members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MemberResponseDto"
        "403":
          description: Forbidden - insufficient permissions
      security:
        - bearer: []
      summary: Get guild members
      tags:
        - members
  /guilds/{guildId}/members/summary:
    get:
      description: Retrieve lightweight active member data for game-client member lookups
      operationId: MembersController_getGuildMembersSummary
      parameters:
        - name: guildId
          required: true
          in: path
          description: Guild ID
          schema:
            example: guild_123
      responses:
        "200":
          description: Lightweight list of guild members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MemberSummaryResponseDto_Output"
        "403":
          description: Forbidden - insufficient permissions
      security:
        - bearer: []
      summary: Get guild members summary
      tags:
        - members
  /guilds/{guildId}/members/refresh-all:
    post:
      description: Create a job to refresh all guild members (admin only)
      operationId: MembersController_refreshAllMembers
      parameters:
        - name: guildId
          required: true
          in: path
          description: Guild ID
          schema:
            example: guild_123
      responses:
        "201":
          description: Bulk refresh job created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberRefreshJobResponseDto"
        "403":
          description: Forbidden - admin permission required
      security:
        - bearer: []
      summary: Refresh all members
      tags:
        - members
  /guilds/{guildId}/members/refresh-jobs/latest:
    get:
      description: Retrieve the latest member refresh job for this guild
      operationId: MembersController_getLatestRefreshJob
      parameters:
        - name: guildId
          required: true
          in: path
          description: Guild ID
          schema:
            example: guild_123
      responses:
        "200":
          description: Latest refresh job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NullableMemberRefreshJobResponseDto"
        "403":
          description: Forbidden - admin permission required
        "404":
          description: No refresh jobs found
      security:
        - bearer: []
      summary: Get latest refresh job
      tags:
        - members
  /guilds/{guildId}/members/refresh-jobs/{jobId}:
    get:
      description: Retrieve the status of a specific refresh job
      operationId: MembersController_getRefreshJobStatus
      parameters:
        - name: jobId
          required: true
          in: path
          description: Refresh job ID
          schema:
            example: "123"
            type: string
        - name: guildId
          required: true
          in: path
          description: Guild ID
          schema:
            example: guild_123
      responses:
        "200":
          description: Refresh job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberRefreshJobResponseDto"
        "403":
          description: Forbidden - admin permission required
        "404":
          description: Refresh job not found
      security:
        - bearer: []
      summary: Get refresh job status
      tags:
        - members
  /guilds/@me:
    get:
      deprecated: true
      description: Legacy endpoint for listing the authenticated user's guilds. Prefer /users/@me/guilds or /users/@me/guilds/accessible.
      operationId: GuildsController_getUserGuilds
      parameters:
        - name: source
          required: false
          in: query
          description: Legacy source selector kept for backward compatibility
          schema:
            type: string
      responses:
        "200":
          description: List of user guilds
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GuildResponseDto_Output"
      security:
        - bearer: []
      summary: Get user guilds (deprecated)
      tags:
        - guilds
  /guilds/@me/permissions:
    get:
      deprecated: true
      description: Legacy endpoint for listing the authenticated user's accessible guilds with role metadata. Prefer /users/@me/guilds for new integrations.
      operationId: GuildsController_getUserGuildsWithPermissions
      parameters: []
      responses:
        "200":
          description: List of user guilds with permissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserGuildPermissionsDto_Output"
      security:
        - bearer: []
      summary: Get user guilds with permissions (deprecated)
      tags:
        - guilds
  /guilds/@me/manageable:
    get:
      description: Retrieve guilds where the authenticated user has Discord administrator permissions
      operationId: GuildsController_getManageableUserGuilds
      parameters: []
      responses:
        "200":
          description: List of manageable user guilds
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GuildResponseDto"
      security:
        - bearer: []
      summary: Get manageable user guilds
      tags:
        - guilds
  /guilds/{guildId}:
    get:
      description: Retrieve guild information by guild ID
      operationId: GuildsController_getGuildById
      parameters:
        - name: guildId
          required: true
          in: path
          description: Guild ID
          schema:
            type: string
      responses:
        "200":
          description: Guild information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuildResponseDto_Output"
      security:
        - bearer: []
      summary: Get guild by ID
      tags:
        - guilds
  /guilds/{guildId}/config:
    patch:
      operationId: GuildsController_updateGuildConfig
      parameters:
        - name: guildId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGuildConfigDto"
      responses:
        "200":
          description: Updated guild config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuildResponseDto_Output"
      security:
        - bearer: []
      tags:
        - guilds
    get:
      operationId: GuildsController_getGuildConfig
      parameters:
        - name: guildId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Guild config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuildResponseDto_Output"
      security:
        - bearer: []
      tags:
        - guilds
  /guilds/{guildId}/worlds:
    get:
      description: Retrieve the list of worlds configured for a guild
      operationId: GuildsController_getWorldsByGuildId
      parameters:
        - name: guildId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of guild worlds
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
      security:
        - bearer: []
      summary: Get guild worlds
      tags:
        - guilds
  /guilds/{guildId}/permissions:
    get:
      description: Retrieve resolved permissions for the current member in a guild
      operationId: GuildsController_getGuildPermissions
      parameters:
        - name: guildId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of member permissions in the guild
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  enum:
                    - OWNER
                    - ADMIN
                    - LOOTLOG_MANAGE
                    - LOOTLOG_ACCESS
                    - LOOTLOG_LOOTS_READ
                    - LOOTLOG_LOOTS_WRITE
                    - LOOTLOG_LOOTS_TITANS_READ
                    - LOOTLOG_LOOTS_HEROES_READ
                    - LOOTLOG_TIMERS_READ
                    - LOOTLOG_TIMERS_WRITE
                    - LOOTLOG_TIMERS_RESET
                    - LOOTLOG_TIMERS_DELETE
                    - LOOTLOG_TIMERS_TITANS_READ
                    - LOOTLOG_TIMERS_HEROES_READ
                    - LOOTLOG_RESERVATIONS_READ
                    - LOOTLOG_RESERVATIONS_WRITE
                    - LOOTLOG_MEMBERS_READ
                    - LOOTLOG_CHAT_READ
                    - LOOTLOG_CHAT_WRITE
                    - LOOTLOG_CHAT_TITANS_READ
                    - LOOTLOG_CHAT_HEROES_READ
                    - LOOTLOG_NOTIFICATIONS_READ
                    - LOOTLOG_NOTIFICATIONS_SEND
                    - LOOTLOG_NOTIFICATIONS_TITANS_READ
                    - LOOTLOG_NOTIFICATIONS_HEROES_READ
                    - LOOTLOG_EVENTS_MANAGE
                    - LOOTLOG_EVENTS_READ
                    - LOOTLOG_EVENTS_WRITE
      security:
        - bearer: []
      summary: Get guild permissions
      tags:
        - guilds
  /guilds/{guildId}/discord-sync:
    get:
      description: Retrieve the current Discord channel synchronization state for a guild
      operationId: GuildsController_getGuildDiscordSyncStatus
      parameters:
        - name: guildId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Guild Discord sync state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordGuildSyncStateResponseDto"
      security:
        - bearer: []
      summary: Get guild Discord sync status
      tags:
        - guilds
  /guilds/{guildId}/discord-sync/refresh:
    post:
      description: Trigger a refresh of the guild Discord channel synchronization state
      operationId: GuildsController_refreshGuildDiscordSync
      parameters:
        - name: guildId
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Refreshed guild Discord sync state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordGuildSyncStateResponseDto"
      security:
        - bearer: []
      summary: Refresh guild Discord sync
      tags:
        - guilds
  /internal/guilds/user-permissions:
    get:
      description: Internal endpoint for gateway service to retrieve user guilds with permissions. Does not require authentication.
      operationId: GuildsInternalController_getUserPermissions
      parameters:
        - name: discordId
          required: true
          in: query
          description: Discord user ID
          schema:
            type: string
        - name: userId
          required: true
          in: query
          description: User ID
          schema:
            type: string
      responses:
        "200":
          description: List of user guilds with permissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserGuildPermissionsDto"
      summary: "[Internal] Get user guilds with permissions"
      tags:
        - internal
  /internal/guilds/{idOrVanityUrl}:
    get:
      description: Internal endpoint for services that need to resolve a guild identifier to its canonical guild data.
      operationId: GuildsInternalController_getGuildByIdOrVanityUrl
      parameters:
        - name: idOrVanityUrl
          required: true
          in: path
          description: Guild ID or vanity URL
          schema:
            type: string
      responses:
        "200":
          description: Resolved guild data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuildResponseDto_Output"
      summary: "[Internal] Get guild by ID or vanity URL"
      tags:
        - internal
  /guilds/{guildId}/roles:
    get:
      description: Retrieve all roles for a guild
      operationId: RolesController_getGuildRoles
      parameters:
        - name: guildId
          required: true
          in: path
          description: Guild ID
          schema:
            example: guild_123
      responses:
        "200":
          description: List of guild roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoleResponseDto_Output"
        "403":
          description: Forbidden - insufficient permissions
      security:
        - bearer: []
      summary: Get guild roles
      tags:
        - roles
  /guilds/{guildId}/roles/{roleId}/permissions:
    patch:
      description: Update permissions for a specific role
      operationId: RolesController_updateGuildRole
      parameters:
        - name: roleId
          required: true
          in: path
          description: Role ID
          schema:
            example: role_123
            type: string
        - name: guildId
          required: true
          in: path
          description: Guild ID
          schema:
            example: guild_123
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRolePermissionsDto"
      responses:
        "200":
          description: Role permissions updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleResponseDto_Output"
        "403":
          description: Forbidden - admin permission required
        "404":
          description: Role not found
      security:
        - bearer: []
      summary: Update role permissions
      tags:
        - roles
  /timers:
    get:
      description: Retrieve all timers accessible to the authenticated user across all guilds
      operationId: TimersController_getAllTimers
      parameters:
        - name: world
          required: false
          in: query
          description: World name filter
          schema:
            type: string
      responses:
        "200":
          description: List of timers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimerResponseDto"
      security:
        - bearer: []
      summary: Get all user timers
      tags:
        - timers
  /guilds/{guildId}/timers:
    get:
      description: Retrieve timers for a specific guild
      operationId: TimersController_getTimers
      parameters:
        - name: world
          required: false
          in: query
          description: World name filter
          schema:
            type: string
        - name: guildId
          required: true
          in: path
          description: Guild ID
          schema:
            example: guild_123
      responses:
        "200":
          description: List of guild timers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimerResponseDto"
        "403":
          description: Forbidden - insufficient permissions
      security:
        - bearer: []
      summary: Get guild timers
      tags:
        - timers
  /guilds/{guildId}/timers/npcs/search:
    get:
      description: Search for NPCs that have been timed in this guild/world, returning their latest respawn configuration
      operationId: TimersController_searchNpcsWithTimerData
      parameters:
        - name: guildId
          required: true
          in: path
          description: Guild ID
          schema:
            example: guild_123
            type: string
        - name: search
          required: true
          in: query
          description: NPC name search term
          schema:
            minLength: 1
            type: string
        - name: world
          required: true
          in: query
          description: World name
          schema:
            minLength: 1
            type: string
        - name: limit
          required: false
          in: query
          description: Result limit (1-50)
          schema:
            minimum: 1
            maximum: 50
            default: 10
            type: number
      responses:
        "200":
          description: List of NPCs with timer metadata
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchTimersNpcResponseDto_Output"
        "403":
          description: Forbidden - insufficient permissions
      security:
        - bearer: []
      summary: Search NPCs with timer data
      tags:
        - timers
  /timers/auto:
    post:
      description: Resolve target guilds from character catching settings and create timers for them
      operationId: TimersController_createAutoTimer
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTimerFromGameClientDto"
      responses:
        "201":
          description: Automatic timer creation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAutoTimerResponseDto_Output"
        "400":
          description: No guild accepted this timer
        "403":
          description: Forbidden
      security:
        - bearer: []
      summary: Create automatic timers
      tags:
        - timers
  /guilds/{guildId}/timers/{timerIdentifier}/reset:
    patch:
      description: Reset a timer for a specific NPC in a guild
      operationId: TimersController_resetTimer
      parameters:
        - name: guildId
          required: true
          in: path
          description: Guild ID
          schema:
            example: guild_123
            type: string
        - name: timerIdentifier
          required: true
          in: path
          description: Timer key or legacy NPC ID when unambiguous
          schema:
            example: 12345:test boss
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetTimerDto"
      responses:
        "200":
          description: Timer reset successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimerResponseDto"
        "403":
          description: Forbidden - insufficient permissions
        "404":
          description: Timer not found
      security:
        - bearer: []
      summary: Reset timer
      tags:
        - timers
  /guilds/{guildId}/timers/{timerIdentifier}:
    delete:
