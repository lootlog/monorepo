components:
  schemas:
    StatusOkResponseDto_Output:
      type: object
      properties:
        status:
          type: string
          enum:
            - OK
      required:
        - status
      additionalProperties: false
    UserPreferencesResponseDto_Output:
      type: object
      properties:
        userId:
          type: string
        guildsOrder:
          type: array
          items:
            type: string
        hiddenGuildIds:
          type: array
          items:
            type: string
        theme:
          type: string
        chatAppearance:
          type: object
          properties:
            npcLayout:
              type: string
              enum:
                - tile
                - inline
            fontScalePercent:
              type: number
              minimum: 70
              maximum: 150
            messageGapPx:
              type: number
              minimum: 0
              maximum: 16
            showTimestamp:
              type: boolean
            showGuildLabel:
              type: boolean
            showNpcAvatar:
              type: boolean
            showNpcLevel:
              type: boolean
            showNpcLocationAndCoordinates:
              type: boolean
          required:
            - npcLayout
            - fontScalePercent
            - messageGapPx
            - showTimestamp
            - showGuildLabel
            - showNpcAvatar
            - showNpcLevel
            - showNpcLocationAndCoordinates
          additionalProperties: false
        mutes:
          type: object
          properties:
            players:
              type: array
              items:
                type: object
                properties:
                  discordId:
                    type: string
                    minLength: 1
                  displayName:
                    type: string
                required:
                  - discordId
                  - displayName
                additionalProperties: false
            npcs:
              type: array
              items:
                type: object
                properties:
                  npcKey:
                    type: string
                    minLength: 1
                  npcId:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  name:
                    type: string
                    minLength: 1
                  npcType:
                    type: string
                    enum:
                      - ELITE2
                      - HERO
                      - COLOSSUS
                      - TITAN
                  lvl:
                    type: integer
                    minimum: 1
                    maximum: 9007199254740991
                  prof:
                    nullable: true
                    type: string
                  icon:
                    nullable: true
                    type: string
                required:
                  - npcKey
                  - npcId
                  - name
                  - npcType
                  - lvl
                  - prof
                  - icon
                additionalProperties: false
          required:
            - players
            - npcs
          additionalProperties: false
      required:
        - userId
        - guildsOrder
        - hiddenGuildIds
        - theme
        - chatAppearance
        - mutes
      additionalProperties: false
    UpdateUserPreferencesDto:
      type: object
      properties:
        guildsOrder:
          type: array
          items:
            type: string
          minItems: 1
        hiddenGuildIds:
          type: array
          items:
            type: string
            minLength: 1
        theme:
          type: string
          enum:
            - default
            - cyberpunk
            - pastel
            - fantasy
            - shonen
            - onepiece
            - anime
            - goth
            - halloween
            - realmadrid
            - realmadrid-3rd
            - barcelona
            - waguri
            - rukia
            - rias
            - cat-pink
