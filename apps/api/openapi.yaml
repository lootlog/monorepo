        - name: maxLvl
          required: true
          in: query
          schema:
            minimum: 0
            maximum: 500
            type: integer
        - name: world
          required: false
          in: query
          schema:
            type: string
        - name: npcTypes
          required: false
          in: query
          schema:
            type: array
            items:
              type: string
              enum:
                - COMMON
                - ELITE
                - ELITE2
                - ELITE3
                - HERO
                - EVENT_HERO
                - TITAN
                - COLOSSUS
                - NPC
        - name: search
          required: false
          in: query
          schema:
            type: string
        - name: limit
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 100
            type: integer
        - name: cursor
          required: true
          in: query
          schema:
            minimum: 0
            maximum: 9007199254740991
            type: integer
        - name: guildId
          required: true
          in: path
          description: Guild ID
          schema:
            example: guild_123
      responses:
        "200":
          description: Member kill statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberKillsResponseDto_Output"
        "403":
          description: Forbidden - insufficient permissions
        "404":
          description: Member not found in guild
      security:
        - bearer: []
      summary: Get kill statistics for a specific guild member
      tags:
        - kills
