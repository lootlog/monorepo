openapi: 3.0.0
info:
  title: Catalog API
  version: "1.0"
  description: Margonem items and NPCs as Lootlog observed them
  contact: {}
paths:
  /healthz:
    get:
      tags:
        - health
      operationId: HealthzController_healthCheck
      parameters: []
      responses:
        "200":
          description: ""
        "400":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestValidationError"
        "401":
          description: ""
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/HttpErrorResponse"
                  - $ref: "#/components/schemas/HttpErrorResponse"
        "403":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "429":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
      summary: Health check
  /catalog/items:
    get:
      tags:
        - Catalog
      operationId: CatalogController_getItems
      parameters:
        - name: search
          in: query
          schema:
            type: string
          required: false
        - name: gameVersion
          in: query
          schema:
            type: string
            enum:
              - en
              - pl
            description: Only entries of this game edition.
          required: false
        - name: ids
          in: query
          schema:
            type: array
            items:
              type: integer
              minimum: -9007199254740991
              maximum: 9007199254740991
          required: false
          style: form
          explode: true
        - name: rarities
          in: query
          schema:
            type: array
            items:
              type: string
          required: false
          style: form
          explode: true
        - name: types
          in: query
          schema:
            type: array
            items:
              type: string
          required: false
          style: form
          explode: true
        - name: categories
          in: query
          schema:
            type: array
            items:
              type: string
              enum:
                - equipment
                - crafting
                - other
            description: "Items of any of these categories: `equipment` for wearable gear, `crafting` for equipment-slot items meant only as crafting ingredients, and `other` for non-equippable items such as keys, bags and consumables."
          required: false
        - name: professions
          in: query
          schema:
            type: array
            items:
              type: string
          required: false
          style: form
          explode: true
        - name: minLevel
          in: query
          schema:
            type: number
          required: false
        - name: maxLevel
          in: query
          schema:
            type: number
          required: false
        - name: statKeys
          in: query
          schema:
            type: array
            items:
              type: string
          required: false
          style: form
          explode: true
        - name: excludedStatKeys
          in: query
          schema:
            type: array
            items:
              type: string
          required: false
          style: form
          explode: true
        - name: legendaryBonuses
          in: query
          schema:
            type: array
            items:
              type: string
          required: false
          style: form
          explode: true
        - name: dropSourceTypes
          in: query
          schema:
            type: array
            items:
              type: string
          required: false
          style: form
          explode: true
        - name: event
          in: query
          schema:
            type: string
            description: "Items of the event with this slug: its name and year, such as `wakacje-2026`."
          required: false
        - name: droppedBy
          in: query
          schema:
            type: string
            description: Items that drop from the NPC with this catalog key.
          required: false
        - name: availableSince
          in: query
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: "Items a character on a world opened on this day (`YYYY-MM-DD`) can get: every item of no event, and event items of an edition that ended after it. Events end in the morning and worlds open later in the day, so an edition ending on the opening day is left out. An event without a year comes back, so its items stay."
          required: false
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - relevance
              - id:desc
              - changedOn:desc
              - lvl:asc
              - lvl:desc
              - name:asc
              - name:desc
              - attackSpeed:desc
              - upgradedAttackSpeed:desc
            description: "`id:desc` lists the items Margonem added most recently first. `changedOn:desc` lists first the items the game changed most recently, by the day their latest revision was first looted; items without a change follow. `attackSpeed:desc` lists first the items that add the most attack speed to a character with at least 100 agility: their own attack speed plus 0.002 for each point of agility or all attributes. `upgradedAttackSpeed:desc` ranks the same attack speed with each item upgraded to +5 and given the +5 bonus that adds the most of it: attack speed on weapons, agility or all attributes on other pieces."
          required: false
        - name: limit
          in: query
          schema:
            type: number
            default: 24
          required: false
        - name: offset
          in: query
          schema:
            type: number
            default: 0
          required: false
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogItemsResponseDto_Output"
        "400":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestValidationError"
        "401":
          description: ""
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/HttpErrorResponse"
                  - $ref: "#/components/schemas/HttpErrorResponse"
        "403":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "429":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "503":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
      summary: List items in the public catalog
  /catalog/npcs:
    get:
      tags:
        - Catalog
      operationId: CatalogController_getNpcs
      parameters:
        - name: search
          in: query
          schema:
            type: string
          required: false
        - name: gameVersion
          in: query
          schema:
            type: string
            enum:
              - en
              - pl
            description: Only entries of this game edition.
          required: false
        - name: ids
          in: query
          schema:
            type: array
            items:
              type: integer
              minimum: -9007199254740991
              maximum: 9007199254740991
          required: false
          style: form
          explode: true
        - name: keys
          in: query
          schema:
            type: array
            items:
              type: string
          required: false
          style: form
          explode: true
        - name: types
          in: query
          schema:
            type: array
            items:
              type: string
          required: false
          style: form
          explode: true
        - name: bossOrigins
          in: query
          schema:
            type: array
            items:
              type: string
          required: false
          style: form
          explode: true
        - name: minLevel
          in: query
          schema:
            type: number
          required: false
        - name: maxLevel
          in: query
          schema:
            type: number
          required: false
        - name: firstSeenMonth
          in: query
          schema:
            type: string
            pattern: ^\d{4}-(?:0[1-9]|1[0-2])$
            description: NPCs Lootlog saw for the first time in this month (`YYYY-MM`, UTC), as `CatalogNpcDto_Output.firstSeenOn`.
          required: false
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - lvl:desc
              - lvl:asc
              - name:asc
              - name:desc
              - firstSeenOn:desc
            description: The order of the NPCs, `lvl:desc` by default; NPCs of one level follow by name. `firstSeenOn:desc` lists first the NPCs Lootlog saw for the first time most recently; NPCs without a first sighting follow. A `search` still ranks by how well a name matches before it.
          required: false
        - name: limit
          in: query
          schema:
            type: number
            default: 24
          required: false
        - name: offset
          in: query
          schema:
            type: number
            default: 0
          required: false
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogNpcsResponseDto_Output"
        "400":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestValidationError"
        "401":
          description: ""
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/HttpErrorResponse"
                  - $ref: "#/components/schemas/HttpErrorResponse"
        "403":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "429":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "503":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
      summary: List NPCs in the public catalog
  /catalog/events:
    get:
      tags:
        - Catalog
      operationId: CatalogController_getEvents
      parameters:
        - name: gameVersion
          in: query
          schema:
            type: string
            enum:
              - en
              - pl
            description: Only entries of this game edition.
          required: false
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogEventsResponseDto_Output"
        "400":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestValidationError"
        "401":
          description: ""
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/HttpErrorResponse"
                  - $ref: "#/components/schemas/HttpErrorResponse"
        "403":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "429":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "503":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
      summary: List events in the public catalog
  /catalog/index:
    get:
      tags:
        - Catalog
      operationId: CatalogController_getIndex
      parameters:
        - name: gameVersion
          in: query
          schema:
            type: string
            enum:
              - en
              - pl
            description: Only entries of this game edition.
          required: false
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogIndexResponseDto_Output"
        "400":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestValidationError"
        "401":
          description: ""
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/HttpErrorResponse"
                  - $ref: "#/components/schemas/HttpErrorResponse"
        "403":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "429":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "503":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
      summary: List every item and NPC in the public catalog
  /catalog/reports:
    post:
      tags:
        - CatalogReports
      operationId: CatalogReportsController_create
      parameters: []
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogReportDto_Output"
        "400":
          description: ""
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/HttpErrorResponse"
                  - $ref: "#/components/schemas/RequestValidationError"
        "401":
          description: ""
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/HttpErrorResponse"
                  - $ref: "#/components/schemas/HttpErrorResponse"
                  - $ref: "#/components/schemas/HttpErrorResponse"
        "403":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "404":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "429":
          description: ""
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/HttpErrorResponse"
                  - $ref: "#/components/schemas/HttpErrorResponse"
      description: "Report that a catalog page shows something wrong. A User keeps one open report per page: reporting it again replaces the reason and comment."
      summary: Report a catalog page
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCatalogReportRequest"
        required: true
    get:
      tags:
        - CatalogReports
      operationId: CatalogReportsController_list
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum:
              - OPEN
              - RESOLVED
              - REJECTED
            description: "`OPEN` until a moderator reviews it; `RESOLVED` when the report was right, `REJECTED` when it was not. A moderator may open a reviewed report again."
            default: OPEN
          required: false
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          required: false
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 9007199254740991
            default: 0
          required: false
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogReportsResponseDto_Output"
        "400":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestValidationError"
        "401":
          description: ""
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/HttpErrorResponse"
                  - $ref: "#/components/schemas/HttpErrorResponse"
                  - $ref: "#/components/schemas/HttpErrorResponse"
        "403":
          description: ""
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/HttpErrorResponse"
                  - $ref: "#/components/schemas/HttpErrorResponse"
        "429":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
      description: List the pages with reports of one status and their reports; catalog moderators only.
      summary: List reported catalog pages
  /catalog/reports/own:
    get:
      tags:
        - CatalogReports
      operationId: CatalogReportsController_getOwn
      parameters:
        - name: subjectType
          in: query
          schema:
            type: string
            enum:
              - ITEM
              - NPC
          required: true
        - name: gameVersion
          in: query
          schema:
            type: string
            enum:
              - en
              - pl
          required: true
        - name: subjectId
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 9007199254740991
          required: true
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogOwnReportResponse"
        "400":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestValidationError"
        "401":
          description: ""
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/HttpErrorResponse"
                  - $ref: "#/components/schemas/HttpErrorResponse"
                  - $ref: "#/components/schemas/HttpErrorResponse"
        "403":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "429":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
      summary: Get your open report about a catalog page
  /catalog/reports/{reportId}:
    delete:
      tags:
        - CatalogReports
      operationId: CatalogReportsController_withdraw
      parameters:
        - name: reportId
          in: path
          schema:
            type: string
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|[fF]{8}-[fF]{4}-[fF]{4}-[fF]{4}-[fF]{12})$
            format: uuid
          required: true
      responses:
        "204":
          description: ""
        "400":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestValidationError"
        "401":
          description: ""
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/HttpErrorResponse"
                  - $ref: "#/components/schemas/HttpErrorResponse"
                  - $ref: "#/components/schemas/HttpErrorResponse"
        "403":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "404":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "429":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
      description: Remove the caller's own report while no moderator has reviewed it.
      summary: Withdraw your open report
  /catalog/reports/viewer:
    get:
      tags:
        - CatalogReports
      operationId: CatalogReportsController_getViewer
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogReportViewerResponse"
        "400":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestValidationError"
        "401":
          description: ""
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/HttpErrorResponse"
                  - $ref: "#/components/schemas/HttpErrorResponse"
                  - $ref: "#/components/schemas/HttpErrorResponse"
        "403":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "429":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
      summary: Get what the caller may do with reports
  /catalog/reports/review:
    post:
      tags:
        - CatalogReports
      operationId: CatalogReportsController_review
      parameters: []
      responses:
        "204":
          description: ""
        "400":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestValidationError"
        "401":
          description: ""
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/HttpErrorResponse"
                  - $ref: "#/components/schemas/HttpErrorResponse"
                  - $ref: "#/components/schemas/HttpErrorResponse"
        "403":
          description: ""
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/HttpErrorResponse"
                  - $ref: "#/components/schemas/HttpErrorResponse"
        "404":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "409":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "429":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
      description: Set the status of reports, resolving, rejecting or opening them again; catalog moderators only. Opening a report again conflicts when its reporter has opened another about the same page since.
      summary: Review catalog reports
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewCatalogReportsRequest"
        required: true
  /catalog/facts/preview:
    post:
      tags:
        - CatalogFacts
      operationId: CatalogFactsController_preview
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogFactPreviewResponse"
        "400":
          description: ""
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/HttpErrorResponse"
                  - $ref: "#/components/schemas/RequestValidationError"
        "401":
          description: ""
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/HttpErrorResponse"
                  - $ref: "#/components/schemas/HttpErrorResponse"
                  - $ref: "#/components/schemas/HttpErrorResponse"
        "403":
          description: ""
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/HttpErrorResponse"
                  - $ref: "#/components/schemas/HttpErrorResponse"
        "429":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
      description: Show which submitted facts are new, already known, or change what the catalog shows, without saving them; catalog moderators only.
      summary: Compare game facts with the catalog
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogFactSubmissionRequest"
        required: true
  /catalog/facts/submissions:
    post:
      tags:
        - CatalogFacts
      operationId: CatalogFactsController_submit
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogFactSubmissionResponse"
        "400":
          description: ""
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/HttpErrorResponse"
                  - $ref: "#/components/schemas/RequestValidationError"
        "401":
          description: ""
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/HttpErrorResponse"
                  - $ref: "#/components/schemas/HttpErrorResponse"
                  - $ref: "#/components/schemas/HttpErrorResponse"
        "403":
          description: ""
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/HttpErrorResponse"
                  - $ref: "#/components/schemas/HttpErrorResponse"
        "429":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
      description: Save facts read from a recording; catalog moderators only. A recording already imported with the same extractor version changes nothing.
      summary: Save game facts
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogFactSubmissionRequest"
        required: true
components:
  schemas:
    HttpErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          nullable: true
          type: string
        details:
          nullable: true
          type: object
      required:
        - code
    RequestValidationError:
      type: object
      properties:
        code:
          type: string
          enum:
            - VALIDATION_ERROR
        message:
          type: string
        details:
          type: object
          properties:
            issues:
              type: array
              items:
                type: object
                properties:
                  path:
                    type: array
                    items:
                      anyOf:
                        - type: string
                        - type: integer
                          minimum: -9007199254740991
                          maximum: 9007199254740991
                  message:
                    type: string
                required:
                  - path
                  - message
          required:
            - issues
      required:
        - code
        - message
        - details
    CatalogFactSubmissionResponse:
      type: object
      properties:
        submissionId:
          type: string
        alreadyImported:
          type: boolean
          description: Whether this recording was imported before with this extractor version; nothing changed then.
        newVariants:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Facts the catalog had not seen in this form before.
        confirmedVariants:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Facts the catalog already knew, now confirmed again.
      required:
        - submissionId
        - alreadyImported
        - newVariants
        - confirmedVariants
