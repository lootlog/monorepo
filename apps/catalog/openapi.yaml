openapi: 3.0.0
info:
  title: Catalog API
  version: "1.0"
  description: Margonem items and NPCs as Lootlog observed them
  contact: {}
paths:
  /healthz:
    get:
      tags:
        - health
      operationId: HealthzController_healthCheck
      parameters: []
      responses:
        "200":
          description: Catalog service is healthy
        "400":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestValidationError"
        "401":
          description: ""
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/HttpErrorResponse"
                  - $ref: "#/components/schemas/HttpErrorResponse"
        "403":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "429":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
      description: Check the health status of the catalog service
      summary: Health check
  /catalog/items:
    get:
      tags:
        - Catalog
      operationId: CatalogController_getItems
      parameters:
        - name: search
          in: query
          schema:
            type: string
          required: false
        - name: gameVersion
          in: query
          schema:
            type: string
            enum:
              - en
              - pl
            description: Only entries of this game edition.
          required: false
        - name: ids
          in: query
          schema:
            type: array
            items:
              type: integer
              minimum: -9007199254740991
              maximum: 9007199254740991
          required: false
          style: form
          explode: true
        - name: rarities
          in: query
          schema:
            type: array
            items:
              type: string
          required: false
          style: form
          explode: true
        - name: types
          in: query
          schema:
            type: array
            items:
              type: string
          required: false
          style: form
          explode: true
        - name: categories
          in: query
          schema:
            type: array
            items:
              type: string
              enum:
                - equipment
                - crafting
                - other
            description: "Items of any of these categories: `equipment` for wearable gear, `crafting` for equipment-slot items meant only as crafting ingredients, and `other` for non-equippable items such as keys, bags and consumables."
          required: false
        - name: professions
          in: query
          schema:
            type: array
            items:
              type: string
          required: false
          style: form
          explode: true
        - name: minLevel
          in: query
          schema:
            type: number
          required: false
        - name: maxLevel
          in: query
          schema:
            type: number
          required: false
        - name: statKeys
          in: query
          schema:
            type: array
            items:
              type: string
          required: false
          style: form
          explode: true
        - name: excludedStatKeys
          in: query
          schema:
            type: array
            items:
              type: string
          required: false
          style: form
          explode: true
        - name: legendaryBonuses
          in: query
          schema:
            type: array
            items:
              type: string
          required: false
          style: form
          explode: true
        - name: dropSourceTypes
          in: query
          schema:
            type: array
            items:
              type: string
          required: false
          style: form
          explode: true
        - name: event
          in: query
          schema:
            type: string
            description: "Items of the event with this slug: its name and year, such as `wakacje-2026`."
          required: false
        - name: droppedBy
          in: query
          schema:
            type: string
            description: Items that drop from the NPC with this catalog key.
          required: false
        - name: availableSince
          in: query
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: "Items a character on a world opened on this day (`YYYY-MM-DD`) can get: every item of no event, and event items of an edition that ended after it. Events end in the morning and worlds open later in the day, so an edition ending on the opening day is left out. An event without a year comes back, so its items stay."
          required: false
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - relevance
              - id:desc
              - changedOn:desc
              - lvl:asc
              - lvl:desc
              - name:asc
              - name:desc
              - attackSpeed:desc
              - upgradedAttackSpeed:desc
            description: "`id:desc` lists the items Margonem added most recently first. `changedOn:desc` lists first the items the game changed most recently, by the day their latest revision was first looted; items without a change follow. `attackSpeed:desc` lists first the items that add the most attack speed to a character with at least 100 agility: their own attack speed plus 0.002 for each point of agility or all attributes. `upgradedAttackSpeed:desc` ranks the same attack speed with each item upgraded to +5 and given the +5 bonus that adds the most of it: attack speed on weapons, agility or all attributes on other pieces."
          required: false
        - name: limit
          in: query
          schema:
            type: number
            default: 24
          required: false
        - name: offset
          in: query
          schema:
            type: number
            default: 0
          required: false
      responses:
        "200":
          description: Public catalog items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogItemsResponseDto_Output"
        "400":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestValidationError"
        "401":
          description: ""
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/HttpErrorResponse"
                  - $ref: "#/components/schemas/HttpErrorResponse"
        "403":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "429":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "503":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
      summary: List items in the public catalog
  /catalog/npcs:
    get:
      tags:
        - Catalog
      operationId: CatalogController_getNpcs
      parameters:
        - name: search
          in: query
          schema:
            type: string
          required: false
        - name: gameVersion
          in: query
          schema:
            type: string
            enum:
              - en
              - pl
            description: Only entries of this game edition.
          required: false
        - name: ids
          in: query
          schema:
            type: array
            items:
              type: integer
              minimum: -9007199254740991
              maximum: 9007199254740991
          required: false
          style: form
          explode: true
        - name: keys
          in: query
          schema:
            type: array
            items:
              type: string
          required: false
          style: form
          explode: true
        - name: types
          in: query
          schema:
            type: array
            items:
              type: string
          required: false
          style: form
          explode: true
        - name: bossOrigins
          in: query
          schema:
            type: array
            items:
              type: string
          required: false
          style: form
          explode: true
        - name: minLevel
          in: query
          schema:
            type: number
          required: false
        - name: maxLevel
          in: query
          schema:
            type: number
          required: false
        - name: firstSeenMonth
          in: query
          schema:
            type: string
            pattern: ^\d{4}-(?:0[1-9]|1[0-2])$
            description: NPCs Lootlog saw for the first time in this month (`YYYY-MM`, UTC), as `CatalogNpcDto_Output.firstSeenOn`.
          required: false
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - lvl:desc
              - lvl:asc
              - name:asc
              - name:desc
              - firstSeenOn:desc
            description: The order of the NPCs, `lvl:desc` by default; NPCs of one level follow by name. `firstSeenOn:desc` lists first the NPCs Lootlog saw for the first time most recently; NPCs without a first sighting follow. A `search` still ranks by how well a name matches before it.
          required: false
        - name: limit
          in: query
          schema:
            type: number
            default: 24
          required: false
        - name: offset
          in: query
          schema:
            type: number
            default: 0
          required: false
      responses:
        "200":
          description: Public catalog NPCs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogNpcsResponseDto_Output"
        "400":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestValidationError"
        "401":
          description: ""
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/HttpErrorResponse"
                  - $ref: "#/components/schemas/HttpErrorResponse"
        "403":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "429":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "503":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
      summary: List NPCs in the public catalog
  /catalog/events:
    get:
      tags:
        - Catalog
      operationId: CatalogController_getEvents
      parameters:
        - name: gameVersion
          in: query
          schema:
            type: string
            enum:
              - en
              - pl
            description: Only entries of this game edition.
          required: false
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogEventsResponseDto_Output"
        "400":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestValidationError"
        "401":
          description: ""
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/HttpErrorResponse"
                  - $ref: "#/components/schemas/HttpErrorResponse"
        "403":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "429":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "503":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
      summary: List events in the public catalog
  /catalog/index:
    get:
      tags:
        - Catalog
      operationId: CatalogController_getIndex
      parameters:
        - name: gameVersion
          in: query
          schema:
            type: string
            enum:
              - en
              - pl
            description: Only entries of this game edition.
          required: false
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogIndexResponseDto_Output"
        "400":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestValidationError"
        "401":
          description: ""
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/HttpErrorResponse"
                  - $ref: "#/components/schemas/HttpErrorResponse"
        "403":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "429":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "503":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
      summary: List every item and NPC in the public catalog
  /catalog/reports:
    post:
      tags:
        - CatalogReports
      operationId: CatalogReportsController_create
      parameters: []
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogReportDto_Output"
        "400":
          description: ""
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/HttpErrorResponse"
                  - $ref: "#/components/schemas/RequestValidationError"
        "401":
          description: ""
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/HttpErrorResponse"
                  - $ref: "#/components/schemas/HttpErrorResponse"
                  - $ref: "#/components/schemas/HttpErrorResponse"
        "403":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "404":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "429":
          description: ""
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/HttpErrorResponse"
                  - $ref: "#/components/schemas/HttpErrorResponse"
      description: "Report that a catalog page shows something wrong. A User keeps one open report per page: reporting it again replaces the reason and comment."
      summary: Report a catalog page
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCatalogReportRequest"
        required: true
    get:
      tags:
        - CatalogReports
      operationId: CatalogReportsController_list
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum:
              - OPEN
              - RESOLVED
              - REJECTED
            description: "`OPEN` until a moderator reviews it; `RESOLVED` when the report was right, `REJECTED` when it was not. A moderator may open a reviewed report again."
            default: OPEN
          required: false
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          required: false
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 9007199254740991
            default: 0
          required: false
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogReportsResponseDto_Output"
        "400":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestValidationError"
        "401":
          description: ""
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/HttpErrorResponse"
                  - $ref: "#/components/schemas/HttpErrorResponse"
                  - $ref: "#/components/schemas/HttpErrorResponse"
        "403":
          description: ""
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/HttpErrorResponse"
                  - $ref: "#/components/schemas/HttpErrorResponse"
        "429":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
      description: List the pages with reports of one status and their reports; catalog moderators only.
      summary: List reported catalog pages
  /catalog/reports/own:
    get:
      tags:
        - CatalogReports
      operationId: CatalogReportsController_getOwn
      parameters:
        - name: subjectType
          in: query
          schema:
            type: string
            enum:
              - ITEM
              - NPC
            description: "The kind of catalog page: an item or an NPC."
          required: true
        - name: gameVersion
          in: query
          schema:
            type: string
            enum:
              - en
              - pl
          required: true
        - name: subjectId
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 9007199254740991
          required: true
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogOwnReportResponse"
        "400":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestValidationError"
        "401":
          description: ""
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/HttpErrorResponse"
                  - $ref: "#/components/schemas/HttpErrorResponse"
                  - $ref: "#/components/schemas/HttpErrorResponse"
        "403":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "429":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
      summary: Get your open report about a catalog page
  /catalog/reports/{reportId}:
    delete:
      tags:
        - CatalogReports
      operationId: CatalogReportsController_withdraw
      parameters:
        - name: reportId
          in: path
          schema:
            type: string
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|[fF]{8}-[fF]{4}-[fF]{4}-[fF]{4}-[fF]{12})$
            format: uuid
          required: true
      responses:
        "204":
          description: ""
        "400":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestValidationError"
        "401":
          description: ""
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/HttpErrorResponse"
                  - $ref: "#/components/schemas/HttpErrorResponse"
                  - $ref: "#/components/schemas/HttpErrorResponse"
        "403":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "404":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "429":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
      description: Remove the caller's own report while no moderator has reviewed it.
      summary: Withdraw your open report
  /catalog/reports/viewer:
    get:
      tags:
        - CatalogReports
      operationId: CatalogReportsController_getViewer
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogReportViewerResponse"
        "400":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestValidationError"
        "401":
          description: ""
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/HttpErrorResponse"
                  - $ref: "#/components/schemas/HttpErrorResponse"
                  - $ref: "#/components/schemas/HttpErrorResponse"
        "403":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "429":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
      summary: Get what the caller may do with reports
  /catalog/reports/review:
    post:
      tags:
        - CatalogReports
      operationId: CatalogReportsController_review
      parameters: []
      responses:
        "204":
          description: ""
        "400":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestValidationError"
        "401":
          description: ""
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/HttpErrorResponse"
                  - $ref: "#/components/schemas/HttpErrorResponse"
                  - $ref: "#/components/schemas/HttpErrorResponse"
        "403":
          description: ""
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/HttpErrorResponse"
                  - $ref: "#/components/schemas/HttpErrorResponse"
        "404":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "409":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "429":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
      description: Set the status of reports, resolving, rejecting or opening them again; catalog moderators only. Opening a report again conflicts when its reporter has opened another about the same page since.
      summary: Review catalog reports
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewCatalogReportsRequest"
        required: true
components:
  schemas:
    RequestValidationError:
      type: object
      properties:
        code:
          type: string
          enum:
            - VALIDATION_ERROR
        message:
          type: string
        details:
          type: object
          properties:
            issues:
              type: array
              items:
                type: object
                properties:
                  path:
                    type: array
                    items:
                      anyOf:
                        - type: string
                        - type: integer
                          minimum: -9007199254740991
                          maximum: 9007199254740991
                  message:
                    type: string
                required:
                  - path
                  - message
          required:
            - issues
      required:
        - code
        - message
        - details
    HttpErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          nullable: true
          type: string
        details:
          nullable: true
          type: object
      required:
        - code
    ReviewCatalogReportsRequest:
      type: object
      properties:
        reportIds:
          type: array
          items:
            type: string
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|[fF]{8}-[fF]{4}-[fF]{4}-[fF]{4}-[fF]{12})$
            format: uuid
          minItems: 1
          maxItems: 100
        status:
          type: string
          enum:
            - OPEN
            - RESOLVED
            - REJECTED
          description: "`OPEN` until a moderator reviews it; `RESOLVED` when the report was right, `REJECTED` when it was not. A moderator may open a reviewed report again."
      required:
        - reportIds
        - status
    CatalogReportsResponseDto_Output:
      type: object
      properties:
        subjects:
          type: array
          items:
            $ref: "#/components/schemas/CatalogReportedSubjectDto_Output"
          description: Pages with reports of the requested status, the most reported first, then the most recently reported.
        total:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Pages with reports of the requested status.
      required:
        - subjects
        - total
      description: Reported catalog pages
    CatalogReportedSubjectDto_Output:
      type: object
      properties:
        subjectType:
          type: string
          enum:
            - ITEM
            - NPC
          description: "The kind of catalog page: an item or an NPC."
        gameVersion:
          type: string
          enum:
            - en
            - pl
        subjectId:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          description: The item or NPC id the page shows.
        name:
          description: The page's current name; `null` once the catalog lost it.
          nullable: true
          type: string
        icon:
          nullable: true
          type: string
        reports:
          type: array
          items:
            $ref: "#/components/schemas/CatalogReportDto_Output"
          description: The page's reports of the requested status, newest first.
      required:
        - subjectType
        - gameVersion
        - subjectId
        - name
        - icon
        - reports
      description: A catalog page and its reports
    CatalogReportDto_Output:
      type: object
      properties:
        id:
          type: string
        subjectType:
          type: string
          enum:
            - ITEM
            - NPC
          description: "The kind of catalog page: an item or an NPC."
        gameVersion:
          type: string
          enum:
            - en
            - pl
        subjectId:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          description: The item or NPC id the page shows.
        reason:
          type: string
          enum:
            - NOT_IN_GAME
            - WRONG_DETAILS
            - WRONG_DROPS
            - WRONG_LOCATIONS
            - OTHER
          description: "What is wrong: `NOT_IN_GAME` for an entry players cannot get, such as a test item; `WRONG_DETAILS` for its name, level, type or statistics; `WRONG_DROPS` for the NPCs an item drops from or the items an NPC drops; `WRONG_LOCATIONS` for the maps an NPC is fought on; `OTHER`, which needs a comment."
        comment:
          nullable: true
          type: string
        status:
          type: string
          enum:
            - OPEN
            - RESOLVED
            - REJECTED
          description: "`OPEN` until a moderator reviews it; `RESOLVED` when the report was right, `REJECTED` when it was not. A moderator may open a reviewed report again."
        createdAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        reviewedAt:
          nullable: true
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
      required:
        - id
        - subjectType
        - gameVersion
        - subjectId
        - reason
        - comment
        - status
        - createdAt
        - reviewedAt
      description: A report that a catalog page shows something wrong
    CatalogReportViewerResponse:
      type: object
      properties:
        canModerate:
          type: boolean
          description: Whether the caller may review reports.
      required:
        - canModerate
    CatalogOwnReportResponse:
      type: object
      properties:
        report:
          description: The caller's open report about the page, if any.
          nullable: true
          $ref: "#/components/schemas/CatalogReportDto_Output"
      required:
        - report
    CreateCatalogReportRequest:
      type: object
      properties:
        subjectType:
          type: string
          enum:
            - ITEM
            - NPC
          description: "The kind of catalog page: an item or an NPC."
        gameVersion:
          type: string
          enum:
            - en
            - pl
        subjectId:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          description: The item or NPC id the page shows.
        reason:
          type: string
          enum:
            - NOT_IN_GAME
            - WRONG_DETAILS
            - WRONG_DROPS
            - WRONG_LOCATIONS
            - OTHER
          description: "What is wrong: `NOT_IN_GAME` for an entry players cannot get, such as a test item; `WRONG_DETAILS` for its name, level, type or statistics; `WRONG_DROPS` for the NPCs an item drops from or the items an NPC drops; `WRONG_LOCATIONS` for the maps an NPC is fought on; `OTHER`, which needs a comment."
        comment:
          type: string
          maxLength: 500
      required:
        - subjectType
        - gameVersion
        - subjectId
        - reason
    CatalogIndexResponseDto_Output:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CatalogIndexEntryDto_Output"
          description: Every item, by id.
        npcs:
          type: array
          items:
            $ref: "#/components/schemas/CatalogIndexEntryDto_Output"
          description: Every NPC as it is now, once per monster, as `CatalogControllerGetNpcs` lists it; by id.
      required:
        - items
        - npcs
      description: Every item and NPC of the public catalog, unlike its searches, which stop at 1000 hits
    CatalogIndexEntryDto_Output:
      type: object
      properties:
        id:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        name:
          type: string
      required:
        - id
        - name
      description: A catalog entry by the id and name its links carry, such as `/items/41392-odzienie-dominujacego-czaru` on the wiki.
    CatalogEventsResponseDto_Output:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/CatalogEventDto_Output"
          description: The latest year first, then by name.
      required:
        - events
      description: Public catalog events
    CatalogEventDto_Output:
      type: object
      properties:
        slug:
          type: string
          description: The event's slug, its name and year, such as `halloween-2026`; `CatalogControllerGetItemsQuery.event` lists its items.
        name:
          type: string
          description: The event as the game writes it, such as `Halloween 2026 r.`.
        year:
          description: The year its name gives; none for an event without one.
          nullable: true
          type: number
        itemCount:
          type: number
          description: How many catalog items belong to the event.
        boss:
          description: The strongest monster its highest-level item drops from, which pictures the event; none when Lootlog has not seen that item drop.
          nullable: true
          type: object
          properties:
            name:
              type: string
            icon:
              nullable: true
              type: string
          required:
            - name
            - icon
          additionalProperties: false
      required:
        - slug
        - name
        - year
        - itemCount
        - boss
      description: A Margonem event whose items are in the public catalog
    CatalogNpcsResponseDto_Output:
      type: object
      properties:
        hits:
          type: array
          items:
            $ref: "#/components/schemas/CatalogNpcDto_Output"
        estimatedTotalHits:
          type: number
      required:
        - hits
        - estimatedTotalHits
      description: Public catalog NPCs
    CatalogNpcDto_Output:
      type: object
      properties:
        key:
          type: string
          description: Stable catalog key of the NPC, used to link its page.
        id:
          type: number
        name:
          type: string
        icon:
          type: string
        lvl:
          type: number
        prof:
          type: string
          description: The NPC's profession as Margonem writes it, such as `w`; empty for most monsters.
        type:
          type: string
          enum:
            - COMMON
            - ELITE
            - ELITE2
            - ELITE3
            - HERO
            - EVENT_HERO
            - COLOSSUS
            - TITAN
            - HERO_TRACKER
            - NPC
        gameVersion:
          type: string
          enum:
            - en
            - pl
        locations:
          type: array
          items:
            type: object
            properties:
              map:
                type: string
                description: The map's name.
              share:
                type: number
                description: The share of the NPC's latest recorded fights on the map, from 0 to 1, rounded to a hundredth.
              tiles:
                type: array
                items:
                  type: object
                  properties:
                    x:
                      type: number
                      description: The tile's column.
                    y:
                      type: number
                      description: The tile's row.
                  required:
                    - x
                    - y
                description: Map tiles where Game clients reported the NPC when it was killed, ordered by column and row; at most the 100 most reported. A second-tier elite placed at random fills its spawn area. Empty until a Game client reports the map's tiles.
            required:
              - map
              - share
              - tiles
          description: Maps the NPC is fought on, most fought first, from its latest 1000 recorded fights; maps under 1% of them are left out. Lootlog recomputes them daily, so an NPC first seen today may have none yet.
        formerLevels:
          type: array
          items:
            type: object
            properties:
              lvl:
                type: number
                description: The level it had.
              until:
                type: string
                description: The UTC day, as `YYYY-MM-DD`, its next level was first recorded.
            required:
              - lvl
              - until
          description: Levels the NPC had before the game changed it, oldest first. Lootlog recomputes them daily from recorded fights and leaves out NPCs whose level follows the player's.
        firstSeenOn:
          description: The day (`YYYY-MM-DD`, UTC) a loot of the NPC first reached Lootlog, under any of its catalog identities. Margonem adds an NPC to every world at once, so it dates the NPC's arrival in the game for NPCs added since Lootlog records them; `null` for an NPC without a recorded first sighting.
          nullable: true
          type: string
      required:
        - key
        - id
        - name
        - icon
        - lvl
        - prof
        - type
        - gameVersion
        - locations
        - formerLevels
        - firstSeenOn
      description: A Margonem NPC in the public catalog
    CatalogItemsResponseDto_Output:
      type: object
      properties:
        hits:
          type: array
          items:
            $ref: "#/components/schemas/CatalogItemDto_Output"
        estimatedTotalHits:
          type: number
      required:
        - hits
        - estimatedTotalHits
      description: Public catalog items
    CatalogItemDto_Output:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        icon:
          type: string
        stat:
          type: string
        lvl:
          type: number
        rarity:
          nullable: true
          type: string
        type:
          nullable: true
          type: string
        droppedBy:
          type: array
          items:
            $ref: "#/components/schemas/CatalogDropSourceDto_Output"
        revisions:
          type: array
          items:
            $ref: "#/components/schemas/CatalogItemRevisionDto_Output"
          description: The changes the game made to the item, oldest first, as Lootlog saw them in loots. Revisions looted side by side, as variants are, are no history and are left out. Lootlog recomputes them daily.
        elasticLevel:
          type: boolean
          description: Whether the item takes the level of the character who loots it, so `lvl` and `stat` describe one of its levels.
      required:
        - id
        - name
        - icon
        - stat
        - lvl
        - rarity
        - type
        - droppedBy
        - revisions
        - elasticLevel
      description: A Margonem item in the public catalog
    CatalogItemRevisionDto_Output:
      type: object
      properties:
        name:
          type: string
        icon:
          type: string
        lvl:
          type: number
          description: The level both revisions have; an elastic item's change is shown at one of its levels.
        stat:
          type: string
        previousName:
          type: string
        previousIcon:
          type: string
        previousStat:
          type: string
        changedAfter:
          type: string
          description: "The day in Poland, as `YYYY-MM-DD`, the old revision was last looted: the game changed the item after it."
        changedBy:
          type: string
          description: "The day in Poland, as `YYYY-MM-DD`, the new revision was first looted: the game changed the item by then."
      required:
        - name
        - icon
        - lvl
        - stat
        - previousName
        - previousIcon
        - previousStat
        - changedAfter
        - changedBy
      description: A change the game made to an item
    CatalogDropSourceDto_Output:
      type: object
      properties:
        key:
          type: string
          description: The NPC's catalog key, as `CatalogNpcDto_Output.key`.
        id:
          type: number
        name:
          type: string
        lvl:
          nullable: true
          type: number
        icon:
          nullable: true
          type: string
        type:
          nullable: true
          type: string
        retired:
          type: boolean
          description: "Whether the NPC no longer drops the item: Lootlog has recorded its loot far too often since the item's last drop for the gap to be chance."
        dropRate:
          description: How often the boss drops the item, counted by the Organizations whose loot settings keep its rarity, from their hourly kill counts on. Lootlog recomputes it daily and gives none for other NPCs or under 100 such kills.
          nullable: true
          type: object
          properties:
            drops:
              type: number
              description: Copies of the item those kills dropped.
            kills:
              type: number
              description: Kills that could have recorded the drop.
            rolls:
              type: number
              description: "Times those kills rolled the boss's loot for someone who could get the item: Margonem rolls a shared loot once per two survivors (5.5 times for 10 on average), and a personal loot once per party member whose profession wears the item. `drops / rolls` is the chance of one roll."
            basis:
              type: string
              enum:
                - PARTY
                - LOOTS
              description: "`PARTY` when the rolls per kill come from the parties the kills reported; `LOOTS` while too few did, estimated from the parties of recorded loots, which counts every member as a survivor and favours larger parties."
            lootMode:
              type: string
              enum:
                - SHARED
                - PERSONAL
              description: "`PERSONAL` when every party member gets a loot of their own over the items of their profession, as from colossi; `SHARED` when the party shares the rolls."
          required:
            - drops
            - kills
            - rolls
            - basis
            - lootMode
          additionalProperties: false
      required:
        - key
        - id
        - name
        - lvl
        - icon
        - type
        - retired
        - dropRate
      description: An NPC an item drops from
tags: []
servers: []
