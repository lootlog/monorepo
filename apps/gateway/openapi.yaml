openapi: 3.0.0
info:
  title: Realtime Gateway API
  version: "1.0"
  contact: {}
paths:
  /healthz:
    get:
      tags:
        - health
      operationId: health.GatewayHealth
      parameters: []
      responses:
        "200":
          description: GatewayHealth
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayHealth"
      description: Reports that the process serves HTTP. Dependency failures never fail liveness.
      summary: Liveness check
  /readyz:
    get:
      tags:
        - health
      operationId: health.GatewayReadiness
      parameters: []
      responses:
        "200":
          description: GatewayReady
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayReady"
        "503":
          description: GatewayUnavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayUnavailable"
      description: "Reports whether this instance accepts new WebSocket sessions: it is subscribed to realtime federation and not draining."
      summary: Readiness check
components:
  schemas:
    GatewayHealth:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
      required:
        - status
    GatewayReady:
      type: object
      properties:
        status:
          type: string
          enum:
            - ready
      required:
        - status
    GatewayUnavailable:
      type: object
      properties:
        status:
          type: string
          enum:
            - unavailable
        reason:
          type: string
          enum:
            - draining
            - federation-unavailable
      required:
        - status
        - reason
tags: []
