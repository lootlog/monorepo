openapi: 3.0.0
info:
  title: Auth API
  version: "1.0"
  description: Authentication and identity service documentation
  contact: {}
paths:
  /healthz:
    get:
      tags:
        - health
      operationId: HealthzController_healthCheck
      parameters: []
      responses:
        "200":
          description: Auth service is healthy
        "400":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestValidationError"
      summary: Health check
  /auth/verify:
    get:
      tags:
        - auth
      operationId: AuthController_verify
      parameters:
        - name: x-auth-user-id
          in: header
          schema:
            type: string
          required: false
        - name: x-auth-discord-id
          in: header
          schema:
            type: string
          required: false
        - name: authorization
          in: header
          schema:
            type: string
          required: false
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - OK
                required:
                  - status
        "400":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestValidationError"
        "401":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "429":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "503":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
      summary: Verify request identity
  /auth/@me/scopes:
    get:
      tags:
        - auth
      operationId: AuthController_getScopes
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "400":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestValidationError"
        "401":
          description: ""
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/HttpErrorResponse"
                  - $ref: "#/components/schemas/ReauthenticationRequiredEncoded"
      summary: Get scopes for the current user
  /auth/idp-token:
    post:
      tags:
        - auth
      operationId: AuthController_getIdpToken
      parameters:
        - name: authorization
          in: header
          schema:
            type: string
          required: false
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  expiresIn:
                    type: number
                  scopes:
                    type: array
                    items:
                      type: string
                required:
                  - accessToken
                  - expiresIn
                  - scopes
        "400":
          description: ""
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/HttpErrorResponse"
                  - $ref: "#/components/schemas/RequestValidationError"
        "401":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
      description: Internal API caller only. Requires the AUTH_IDP_TOKEN_SECRET bearer credential; user sessions and forwarded identity headers do not authorize this operation.
      summary: Issue an IDP token for a user account
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                discordId:
                  type: string
              required:
                - userId
                - discordId
        required: true
  /auth/internal/platform-role-holders:
    get:
      tags:
        - auth
      operationId: AuthController_listPlatformRoleHolders
      parameters:
        - name: authorization
          in: header
          schema:
            type: string
          required: false
        - name: role
          in: query
          schema:
            type: string
            enum:
              - admin
              - wiki-moderator
              - global-chat-admin
          required: true
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  userIds:
                    type: array
                    items:
                      type: string
                required:
                  - userIds
        "400":
          description: ""
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/HttpErrorResponse"
                  - $ref: "#/components/schemas/RequestValidationError"
        "401":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "503":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
      description: Internal API caller only. Requires the AUTH_IDP_TOKEN_SECRET bearer credential. An admin holds every role, so admins are listed for each.
      summary: List the users holding a platform role
  /auth/api-keys:
    get:
      tags:
        - apiKeys
      operationId: apiKeys.ListApiKeys
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      properties:
                        organizationIds:
                          type: array
                          items:
                            type: string
                            pattern: ^\d{1,20}$
                          maxItems: 100
                        mode:
                          type: string
                          enum:
                            - read
                            - read-write
                        personalData:
                          type: boolean
                        id:
                          type: string
                        name:
                          type: string
                        start:
                          nullable: true
                          type: string
                        createdAt:
                          type: string
                        expiresAt:
                          nullable: true
                          type: string
                      required:
                        - organizationIds
                        - mode
                        - personalData
                        - id
                        - name
                        - start
                        - createdAt
                        - expiresAt
                required:
                  - keys
        "400":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestValidationError"
        "401":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "403":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "503":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
    post:
      tags:
        - apiKeys
      operationId: apiKeys.CreateApiKey
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  organizationIds:
                    type: array
                    items:
                      type: string
                      pattern: ^\d{1,20}$
                    maxItems: 100
                  mode:
                    type: string
                    enum:
                      - read
                      - read-write
                  personalData:
                    type: boolean
                  id:
                    type: string
                  name:
                    type: string
                  start:
                    nullable: true
                    type: string
                  createdAt:
                    type: string
                  expiresAt:
                    nullable: true
                    type: string
                  key:
                    type: string
                required:
                  - organizationIds
                  - mode
                  - personalData
                  - id
                  - name
                  - start
                  - createdAt
                  - expiresAt
                  - key
        "400":
          description: ""
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/HttpErrorResponse"
                  - $ref: "#/components/schemas/RequestValidationError"
        "401":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "403":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "404":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "409":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "503":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                organizationIds:
                  type: array
                  items:
                    type: string
                    pattern: ^\d{1,20}$
                  maxItems: 100
                mode:
                  type: string
                  enum:
                    - read
                    - read-write
                personalData:
                  type: boolean
                name:
                  type: string
                expiresIn:
                  nullable: true
                  type: number
                  enum:
                    - 2592000
                    - 7776000
                    - 31536000
              required:
                - organizationIds
                - mode
                - personalData
                - name
                - expiresIn
        required: true
  /auth/api-keys/{id}:
    patch:
      tags:
        - apiKeys
      operationId: apiKeys.RenameApiKey
      parameters:
        - name: id
          in: path
          schema:
            type: string
            minLength: 1
          required: true
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  organizationIds:
                    type: array
                    items:
                      type: string
                      pattern: ^\d{1,20}$
                    maxItems: 100
                  mode:
                    type: string
                    enum:
                      - read
                      - read-write
                  personalData:
                    type: boolean
                  id:
                    type: string
                  name:
                    type: string
                  start:
                    nullable: true
                    type: string
                  createdAt:
                    type: string
                  expiresAt:
                    nullable: true
                    type: string
                required:
                  - organizationIds
                  - mode
                  - personalData
                  - id
                  - name
                  - start
                  - createdAt
                  - expiresAt
        "400":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestValidationError"
        "401":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "403":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "404":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "503":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
              required:
                - name
        required: true
    delete:
      tags:
        - apiKeys
      operationId: apiKeys.DeleteApiKey
      parameters:
        - name: id
          in: path
          schema:
            type: string
            minLength: 1
          required: true
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                required:
                  - success
        "400":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestValidationError"
        "401":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "403":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "404":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "503":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
  /auth/internal/api-keys/status:
    post:
      tags:
        - apiKeys
      operationId: apiKeys.ApiKeyStatuses
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      anyOf:
                        - type: object
                          properties:
                            keyId:
                              type: string
                              minLength: 1
                            valid:
                              type: boolean
                              enum:
                                - false
                          required:
                            - keyId
                            - valid
                        - type: object
                          properties:
                            keyId:
                              type: string
                              minLength: 1
                            valid:
                              type: boolean
                              enum:
                                - true
                            access:
                              type: object
                              properties:
                                organizationIds:
                                  type: array
                                  items:
                                    type: string
                                    pattern: ^\d{1,20}$
                                  maxItems: 100
                                mode:
                                  type: string
                                  enum:
                                    - read
                                    - read-write
                                personalData:
                                  type: boolean
                                keyId:
                                  type: string
                                  minLength: 1
                                expiresAt:
                                  nullable: true
                                  type: string
                              required:
                                - organizationIds
                                - mode
                                - personalData
                                - keyId
                                - expiresAt
                            userId:
                              type: string
                              minLength: 1
                            discordId:
                              type: string
                              minLength: 1
                          required:
                            - keyId
                            - valid
                            - access
                            - userId
                            - discordId
                required:
                  - keys
        "400":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestValidationError"
        "401":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "503":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                keyIds:
                  type: array
                  items:
                    type: string
                    minLength: 1
                  maxItems: 100
              required:
                - keyIds
        required: true
  /admin/session:
    get:
      tags:
        - admin
      operationId: AdminController_session
      parameters:
