  /admin/users:
    get:
      tags:
        - admin
      operationId: AdminController_listUsers
      parameters:
        - name: authorization
          in: header
          schema:
            type: string
          required: false
        - name: cookie
          in: header
          schema:
            type: string
          required: false
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
          required: false
        - name: role
          in: query
          schema:
            type: string
            enum:
              - admin
              - wiki-moderator
              - global-chat-admin
          required: false
        - name: banned
          in: query
          schema:
            type: string
            enum:
              - "true"
              - "false"
          required: false
        - name: userIds
          in: query
          schema:
            type: array
            items:
              type: string
              minLength: 1
            maxItems: 500
          required: false
        - name: excludedUserIds
          in: query
          schema:
            type: array
            items:
              type: string
              minLength: 1
            maxItems: 500
          required: false
        - name: limit
          in: query
          schema:
            type: string
            pattern: ^[+-]?(?:\d+(?:\.\d+)?|\.\d+)(?:[Ee][+-]?\d+)?$
          required: false
        - name: offset
          in: query
          schema:
            type: string
            pattern: ^[+-]?(?:\d+(?:\.\d+)?|\.\d+)(?:[Ee][+-]?\d+)?$
          required: false
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUsersResponse"
        "400":
          description: ""
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/HttpErrorResponse"
                  - $ref: "#/components/schemas/RequestValidationError"
        "401":
          description: ""
