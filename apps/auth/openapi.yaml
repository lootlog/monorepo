openapi: 3.0.0
info:
  title: Auth API
  version: "1.0"
  description: Authentication and identity service documentation
  contact: {}
paths:
  /healthz:
    get:
      tags:
        - health
      operationId: HealthzController_healthCheck
      parameters: []
      responses:
        "200":
          description: Auth service is healthy
      summary: Health check
  /auth/verify:
    get:
      tags:
        - auth
      operationId: AuthController_verify
      parameters:
        - name: x-auth-user-id
          in: header
          schema:
            type: string
          required: false
        - name: x-auth-discord-id
          in: header
          schema:
            type: string
          required: false
        - name: authorization
          in: header
          schema:
            type: string
          required: false
        - name: x-lootlog-credential-purpose
          in: header
          schema:
            type: string
            enum:
              - websocket-ticket
          required: false
        - name: x-lootlog-websocket-origin
          in: header
          schema:
            type: string
          required: false
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - OK
                required:
                  - status
      summary: Verify request identity
  /auth/realtime-ticket:
    post:
      tags:
        - auth
      operationId: AuthController_issueRealtimeTicket
      parameters: []
      responses:
        "201":
          description: Short-lived single-use websocket ticket
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket:
                    type: string
                  expiresAt:
                    type: number
                required:
                  - ticket
                  - expiresAt
      summary: Issue a single-use realtime ticket
  /auth/@me/scopes:
    get:
      tags:
        - auth
      operationId: AuthController_getScopes
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
      summary: Get scopes for the current user
  /auth/idp-token:
    post:
      tags:
        - auth
      operationId: AuthController_getIdpToken
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  expiresIn:
                    type: number
                  scopes:
                    type: array
                    items:
                      type: string
                required:
                  - accessToken
                  - expiresIn
                  - scopes
      summary: Issue an IDP token for a user account
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                discordId:
                  type: string
              required:
                - userId
                - discordId
        required: true
components:
  schemas: {}
tags: []
servers: []
