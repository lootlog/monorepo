                  organizationIds:
                    type: array
                    items:
                      type: string
                      pattern: ^\d{1,20}$
                    maxItems: 100
                  mode:
                    type: string
                    enum:
                      - read
                      - read-write
                  personalData:
                    type: boolean
                  id:
                    type: string
                  name:
                    type: string
                  start:
                    nullable: true
                    type: string
                  createdAt:
                    type: string
                  expiresAt:
                    nullable: true
                    type: string
                  key:
                    type: string
