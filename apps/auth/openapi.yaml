openapi: 3.0.0
info:
  title: Auth API
  version: "1.0"
  description: Authentication and identity service documentation
  contact: {}
paths:
  /healthz:
    get:
      tags:
        - health
      operationId: HealthzController_healthCheck
      parameters: []
      responses:
        "200":
          description: Auth service is healthy
        "400":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestValidationError"
      summary: Health check
  /auth/verify:
    get:
      tags:
        - auth
      operationId: AuthController_verify
      parameters:
        - name: x-auth-user-id
          in: header
          schema:
            type: string
          required: false
        - name: x-auth-discord-id
          in: header
          schema:
            type: string
          required: false
        - name: authorization
          in: header
          schema:
            type: string
          required: false
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - OK
                required:
                  - status
        "400":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestValidationError"
        "401":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "429":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "503":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
      summary: Verify request identity
  /auth/@me/scopes:
    get:
      tags:
        - auth
      operationId: AuthController_getScopes
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "400":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestValidationError"
        "401":
          description: ""
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/HttpErrorResponse"
                  - $ref: "#/components/schemas/ReauthenticationRequiredEncoded"
      summary: Get scopes for the current user
  /auth/api-keys:
    get:
      tags:
        - apiKeys
      operationId: apiKeys.ListApiKeys
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      properties:
                        organizationIds:
                          type: array
                          items:
                            type: string
                            pattern: ^\d{1,20}$
                          maxItems: 100
                        mode:
                          type: string
                          enum:
                            - read
                            - read-write
                        personalData:
                          type: boolean
                        id:
                          type: string
                        name:
                          type: string
                        start:
                          nullable: true
                          type: string
                        createdAt:
                          type: string
                        expiresAt:
                          nullable: true
                          type: string
                      required:
                        - organizationIds
                        - mode
                        - personalData
                        - id
                        - name
                        - start
                        - createdAt
                        - expiresAt
                required:
                  - keys
        "400":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestValidationError"
        "401":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "403":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "503":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
    post:
      tags:
        - apiKeys
      operationId: apiKeys.CreateApiKey
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  organizationIds:
                    type: array
                    items:
                      type: string
                      pattern: ^\d{1,20}$
                    maxItems: 100
                  mode:
                    type: string
                    enum:
                      - read
                      - read-write
                  personalData:
                    type: boolean
                  id:
                    type: string
                  name:
                    type: string
                  start:
                    nullable: true
                    type: string
                  createdAt:
                    type: string
                  expiresAt:
                    nullable: true
                    type: string
                  key:
                    type: string
                required:
                  - organizationIds
                  - mode
                  - personalData
                  - id
                  - name
                  - start
                  - createdAt
                  - expiresAt
                  - key
        "400":
          description: ""
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/HttpErrorResponse"
                  - $ref: "#/components/schemas/RequestValidationError"
        "401":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "403":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "404":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "409":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "503":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                organizationIds:
                  type: array
                  items:
                    type: string
                    pattern: ^\d{1,20}$
                  maxItems: 100
                mode:
                  type: string
                  enum:
                    - read
                    - read-write
                personalData:
                  type: boolean
                name:
                  type: string
                expiresIn:
                  nullable: true
                  type: number
                  enum:
                    - 2592000
                    - 7776000
                    - 31536000
              required:
                - organizationIds
                - mode
                - personalData
                - name
                - expiresIn
        required: true
  /auth/api-keys/{id}:
    patch:
      tags:
        - apiKeys
      operationId: apiKeys.RenameApiKey
      parameters:
        - name: id
          in: path
          schema:
            type: string
            minLength: 1
          required: true
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  organizationIds:
                    type: array
                    items:
                      type: string
                      pattern: ^\d{1,20}$
                    maxItems: 100
                  mode:
                    type: string
                    enum:
                      - read
                      - read-write
                  personalData:
                    type: boolean
                  id:
                    type: string
                  name:
                    type: string
                  start:
                    nullable: true
                    type: string
                  createdAt:
                    type: string
                  expiresAt:
                    nullable: true
                    type: string
                required:
                  - organizationIds
                  - mode
                  - personalData
                  - id
                  - name
                  - start
                  - createdAt
                  - expiresAt
        "400":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestValidationError"
        "401":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "403":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "404":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "503":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
              required:
                - name
        required: true
    delete:
      tags:
        - apiKeys
      operationId: apiKeys.DeleteApiKey
      parameters:
        - name: id
          in: path
          schema:
            type: string
            minLength: 1
          required: true
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                required:
                  - success
        "400":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestValidationError"
        "401":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "403":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "404":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "503":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
components:
  schemas:
    RequestValidationError:
      type: object
      properties:
        code:
          type: string
          enum:
            - VALIDATION_ERROR
        message:
          type: string
        details:
          type: object
          properties:
            issues:
              type: array
              items:
                type: object
                properties:
                  path:
                    type: array
                    items:
                      anyOf:
                        - type: string
                        - type: integer
                          minimum: -9007199254740991
                          maximum: 9007199254740991
                  message:
                    type: string
                required:
                  - path
                  - message
          required:
            - issues
      required:
        - code
        - message
        - details
    HttpErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          nullable: true
          type: string
        details:
          nullable: true
          type: object
      required:
        - code
    ReauthenticationRequiredEncoded:
      type: object
      properties:
        _tag:
          type: string
          enum:
            - ReauthenticationRequired
        code:
          type: string
        requiresReauth:
          type: boolean
          enum:
            - true
      required:
        - _tag
        - code
        - requiresReauth
tags: []
servers: []
