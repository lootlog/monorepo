openapi: 3.0.0
info:
  title: Auth API
  version: "1.0"
  description: Authentication and identity service documentation
  contact: {}
paths:
  /healthz:
    get:
      tags:
        - health
      operationId: HealthzController_healthCheck
      parameters: []
      responses:
        "200":
          description: Auth service is healthy
      summary: Health check
  /auth/verify:
    get:
      tags:
        - auth
      operationId: AuthController_verify
      parameters:
        - name: x-auth-user-id
          in: header
          schema:
            type: string
          required: false
        - name: x-auth-discord-id
          in: header
          schema:
            type: string
          required: false
        - name: authorization
          in: header
          schema:
            type: string
          required: false
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - OK
                required:
                  - status
        "401":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
        "429":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
        "503":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
      summary: Verify request identity
  /auth/@me/scopes:
    get:
      tags:
        - auth
      operationId: AuthController_getScopes
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
      summary: Get scopes for the current user
  /auth/idp-token:
    post:
      tags:
        - auth
      operationId: AuthController_getIdpToken
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  expiresIn:
                    type: number
                  scopes:
                    type: array
                    items:
                      type: string
                required:
                  - accessToken
                  - expiresIn
                  - scopes
      summary: Issue an IDP token for a user account
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                discordId:
                  type: string
              required:
                - userId
                - discordId
        required: true
  /auth/api-keys:
    get:
      tags:
        - apiKeys
      operationId: apiKeys.ListApiKeys
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      properties:
                        organizationIds:
                          type: array
                          items:
                            type: string
                            pattern: ^\d{1,20}$
                          maxItems: 100
                        mode:
                          type: string
                          enum:
                            - read
                            - read-write
                        personalData:
                          type: boolean
                        id:
                          type: string
                        name:
                          type: string
                        start:
                          nullable: true
                          type: string
                        createdAt:
                          type: string
                        expiresAt:
                          nullable: true
                          type: string
                      required:
                        - organizationIds
                        - mode
                        - personalData
                        - id
                        - name
                        - start
                        - createdAt
                        - expiresAt
                required:
                  - keys
        "400":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
        "401":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
        "403":
          description: ""
          content:
            application/json:
