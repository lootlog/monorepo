                  - personalData
                  - id
                  - name
                  - start
                  - createdAt
                  - expiresAt
                  - key
        "400":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
        "401":
          description: ""
          content:
            application/json:
