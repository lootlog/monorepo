  /auth/internal/api-keys/status:
    post:
      tags:
        - apiKeys
      operationId: apiKeys.ApiKeyStatuses
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      anyOf:
                        - type: object
                          properties:
                            keyId:
                              type: string
                              minLength: 1
                            valid:
                              type: boolean
                              enum:
                                - false
                          required:
                            - keyId
                            - valid
                        - type: object
                          properties:
                            keyId:
                              type: string
                              minLength: 1
                            valid:
                              type: boolean
                              enum:
                                - true
                            access:
                              type: object
                              properties:
                                organizationIds:
                                  type: array
                                  items:
                                    type: string
                                    pattern: ^\d{1,20}$
                                  maxItems: 100
                                mode:
                                  type: string
                                  enum:
                                    - read
                                    - read-write
                                personalData:
                                  type: boolean
                                keyId:
                                  type: string
                                  minLength: 1
                                expiresAt:
                                  nullable: true
                                  type: string
                              required:
                                - organizationIds
                                - mode
                                - personalData
                                - keyId
                                - expiresAt
                            userId:
                              type: string
                              minLength: 1
                            discordId:
                              type: string
                              minLength: 1
                          required:
