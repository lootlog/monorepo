      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                organizationIds:
                  type: array
                  items:
                    type: string
                    pattern: ^\d{1,20}$
                  maxItems: 100
                mode:
                  type: string
                  enum:
                    - read
                    - read-write
                personalData:
                  type: boolean
                name:
                  type: string
                expiresIn:
                  nullable: true
                  type: number
                  enum:
                    - 2592000
                    - 7776000
