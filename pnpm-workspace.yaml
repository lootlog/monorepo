packages:
  - "apps/*"
  - "packages/*"
syncInjectedDepsAfterScripts:
  - build
injectWorkspacePackages: true
verifyDepsBeforeRun: false
packageExtensions:
  "@hookform/resolvers":
    peerDependencies:
      zod: "*"
onlyBuiltDependencies:
  - "@nestjs/core"
  - "@prisma/client"
  - "@prisma/engines"
  - "@scarf/scarf"
  - "@swc/core"
  - "@tailwindcss/oxide"
  - core-js-pure
  - cpu-features
  - esbuild
  - msgpackr-extract
  - rolldown
  - necord
  - prisma
  - protobufjs
  - sharp
  - ssh2
  - unrs-resolver
  - workerd
minimumReleaseAgeExclude:
  - esbuild@0.24.3
  - "@hono/node-server@1.19.13"
  - postcss@8.5.10
  - js-cookie@3.0.6
  - esbuild@0.28.1
