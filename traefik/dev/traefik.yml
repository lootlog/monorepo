log:
  level: DEBUG

# Enables the endpoint behind the compose healthcheck; the static file
# configuration replaces every CLI flag, including --ping.
ping: {}

api:
  insecure: true
  dashboard: true

providers:
  docker:
    exposedByDefault: false
  file:
    filename: "/etc/traefik/traefik_dynamic.yml"
    watch: true

entryPoints:
  web:
    address: ":80"
    # http:
    #   redirections:
    #     entryPoint:
    #       to: websecure
    #       scheme: https
  websecure:
    address: ":443"
